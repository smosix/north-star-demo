<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>North Star for Dowds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left nav (three groups) + scrolling work area of role-aware cards; drawer nav under 900px */
:root{
  --bg:#F0F2F4; --surface:#FFFFFF; --sunk:#E5E9ED; --ink:#14202E; --muted:#56616E; --line:#D7DDE3;
  --accent:#1F5E8C; --accent-soft:#E2EDF6; --gold:#9A6400; --gold-soft:#F8ECD4;
  --good:#22704E; --good-soft:#E1F1E8; --warn:#9A5B00; --warn-soft:#FBEBD3; --bad:#A82A20; --bad-soft:#F8E1DE;
  --nav:#14202E; --nav-ink:#D5DDE6; --nav-muted:#8B98A7; --nav-active:#24364A;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs:15px; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --sunk:#212C38; --ink:#E8EDF2; --muted:#9DA9B6; --line:#2B3744;
  --accent:#7DB6E3; --accent-soft:#1B3347; --gold:#F0B44A; --gold-soft:#3A2C12;
  --good:#63C595; --good-soft:#173527; --warn:#E8A84A; --warn-soft:#3B2A10; --bad:#F2857B; --bad-soft:#401C1A;
  --nav:#0A0F15; --nav-ink:#D5DDE6; --nav-muted:#7C8998; --nav-active:#1C2A3A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --sunk:#212C38; --ink:#E8EDF2; --muted:#9DA9B6; --line:#2B3744;
  --accent:#7DB6E3; --accent-soft:#1B3347; --gold:#F0B44A; --gold-soft:#3A2C12;
  --good:#63C595; --good-soft:#173527; --warn:#E8A84A; --warn-soft:#3B2A10; --bad:#F2857B; --bad-soft:#401C1A;
  --nav:#0A0F15; --nav-ink:#D5DDE6; --nav-muted:#7C8998; --nav-active:#1C2A3A; color-scheme:dark}
:root.hc{--muted:var(--ink); --line:var(--ink)}
:root.big{--fs:17.5px}
:root.dys body{letter-spacing:.03em; word-spacing:.12em; line-height:1.75}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:var(--fs); line-height:1.55}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--nav)}
a{color:var(--accent)}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px}
.skip{position:absolute; left:-999px; top:8px; background:var(--surface); padding:8px 12px; z-index:100}
.skip:focus{left:16px}
h1,h2,h3{text-wrap:balance; margin:0}
.mono,.num{font-family:var(--f-data); font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100%}
.nav{background:var(--nav); color:var(--nav-ink); position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px)); overflow-y:auto; padding-block:20px 28px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:16px}
.brand{display:flex; gap:10px; align-items:center; padding:4px 8px 18px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display); font-weight:600; font-size:1.25rem; display:block; line-height:1.1}
.brand span{font-size:.72rem; color:var(--nav-muted); letter-spacing:.06em; text-transform:uppercase}
.nav h4{font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--nav-muted); margin:18px 8px 6px; font-weight:600}
.nav ul{list-style:none; margin:0; padding:0; display:grid; gap:1px}
.nav button{all:unset; box-sizing:border-box; width:100%; display:flex; justify-content:space-between; align-items:center; padding:6px 10px; border-radius:7px; cursor:pointer; font-size:.88rem; color:var(--nav-ink)}
.nav button:hover{background:var(--nav-active)}
.nav button[aria-current="page"]{background:var(--nav-active); color:#fff; box-shadow:inset 3px 0 0 var(--gold)}
.nav button:focus-visible{outline:2px solid var(--gold)}
.pill-n{font-family:var(--f-data); font-size:.7rem; background:var(--gold); color:#14202E; border-radius:99px; padding:0 6px}
.nav .tour-btn{margin-top:22px; background:var(--nav-active); justify-content:center; font-weight:600}

.main{min-width:0; display:flex; flex-direction:column}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding-block:10px; padding-left:24px; padding-right:max(16px, env(safe-area-inset-right,0px))}
.crumb{font-size:.8rem; color:var(--muted); flex:1 1 260px; min-width:0}
.crumb b{color:var(--ink)}
.tag{font-family:var(--f-data); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--line); border-radius:4px; padding:1px 6px; color:var(--muted)}
.role{display:flex; align-items:center; gap:8px}
.avatar{width:32px; height:32px; border-radius:50%; background:var(--accent); color:var(--surface); display:grid; place-items:center; font-size:.78rem; font-weight:700; flex:none}
select,input[type="text"],input[type="search"]{font:inherit; font-size:.88rem; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 8px}
.tbtn{background:transparent; border:1px solid var(--line); border-radius:7px; padding:6px 10px; cursor:pointer; font-size:.85rem; display:inline-flex; align-items:center; gap:6px}
.tbtn:hover{border-color:var(--accent)}
.tbtn .pill-n{background:var(--bad); color:#fff}
.menu-btn{display:none}

.content{padding-block:28px 64px; padding-left:24px; padding-right:max(16px, env(safe-area-inset-right,0px)); max-width:1240px; width:100%}
.eyebrow{font-size:.78rem; color:var(--muted); letter-spacing:.02em}
.eyebrow .season{color:var(--gold); font-weight:600}
.page-h{font-family:var(--f-display); font-weight:600; font-size:clamp(1.7rem,1.2rem + 1.6vw,2.4rem); line-height:1.15; margin:4px 0 6px}
.lede{color:var(--muted); max-width:66ch; margin:0 0 22px}

.grid{display:grid; gap:16px; grid-template-columns:repeat(12,minmax(0,1fr))}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; min-width:0; display:flex; flex-direction:column; gap:10px}
.card h2{font-family:var(--f-display); font-weight:600; font-size:1.12rem}
.card .sub{color:var(--muted); font-size:.87rem; margin:0}
.card .foot{margin-top:auto; padding-top:6px}
.link{all:unset; cursor:pointer; color:var(--accent); font-weight:600; font-size:.86rem}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--accent)}
.big-n{font-family:var(--f-display); font-size:2.3rem; font-weight:600; line-height:1}
.big-n small{font-family:var(--f-body); font-size:.95rem; color:var(--muted); font-weight:400}

/* KPI list */
.kpis{list-style:none; margin:0; padding:0; display:grid; gap:0}
.kpi{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line)}
.kpi:first-child{border-top:0}
.kpi .id{font-family:var(--f-data); font-size:.78rem; color:var(--muted)}
.kpi .t{font-size:.92rem}
.kpi .bar{height:5px; background:var(--sunk); border-radius:3px; margin-top:6px; overflow:hidden}
.kpi .bar i{display:block; height:100%; background:var(--accent)}
.kpi.behind .bar i{background:var(--warn)}
.status{font-size:.74rem; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap}
.st-good{background:var(--good-soft); color:var(--good)}
.st-warn{background:var(--warn-soft); color:var(--warn)}
.st-bad{background:var(--bad-soft); color:var(--bad)}
.st-info{background:var(--accent-soft); color:var(--accent)}
.st-gold{background:var(--gold-soft); color:var(--gold)}

.banner{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; background:var(--warn-soft); border-radius:8px; padding:10px 14px; font-size:.9rem}
.btn{background:var(--accent); color:var(--surface); border:0; border-radius:7px; padding:8px 14px; font-weight:600; cursor:pointer; font-size:.86rem}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent)}
.btn:disabled{opacity:.55; cursor:default}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px}
.stat b{display:block; font-family:var(--f-display); font-size:1.8rem; font-weight:600; line-height:1.1}
.stat span{font-size:.82rem; color:var(--muted)}

/* stacked bar */
.stack{display:flex; height:14px; border-radius:4px; overflow:hidden; background:var(--sunk)}
.stack i{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.78rem; color:var(--muted)}
.legend span::before{content:""; display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; background:var(--c)}
.sg-row{display:grid; grid-template-columns:150px minmax(0,1fr) 56px; gap:10px; align-items:center; font-size:.85rem}
.sg-row .num{text-align:right; color:var(--muted); font-size:.8rem}

/* tables */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:8px}
table{border-collapse:collapse; width:100%; font-size:.86rem; background:var(--surface)}
th,td{text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; background:var(--sunk); white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.heat td.h{text-align:center; font-family:var(--f-data); font-size:.8rem}

/* chips */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 12px; cursor:pointer; font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--surface); border-color:var(--accent)}
.course-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.course{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:8px}
.course h3{font-size:.98rem; font-weight:600}
.course p{margin:0; font-size:.84rem; color:var(--muted)}
.meta{display:flex; flex-wrap:wrap; gap:6px; font-size:.74rem}
.meta span{background:var(--sunk); border-radius:4px; padding:1px 7px; color:var(--muted)}
.meta span.m{background:var(--bad-soft); color:var(--bad); font-weight:600}

/* pathway */
.path{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; counter-reset:p}
.path li{position:relative; padding:14px 16px 14px 16px; border:1px solid var(--line); background:var(--surface); counter-increment:p}
.path li:first-child{border-radius:var(--r) 0 0 var(--r)}
.path li:last-child{border-radius:0 var(--r) var(--r) 0}
.path li+li{border-left:0}
.path li::before{content:"Level " counter(p); font-family:var(--f-data); font-size:.7rem; color:var(--gold); letter-spacing:.06em; text-transform:uppercase}
.path h3{font-size:1rem; margin:4px 0}
.path p{margin:0; font-size:.82rem; color:var(--muted)}
.path .who{margin-top:8px; font-size:.78rem; color:var(--ink)}

/* list rows */
.rows{list-style:none; margin:0; padding:0}
.rows li{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); font-size:.88rem}
.rows li:first-child{border-top:0}
.rows small{color:var(--muted); display:block; font-size:.78rem}

/* chat */
.chat{display:grid; gap:10px}
.msg{max-width:78ch; padding:10px 14px; border-radius:10px; font-size:.9rem}
.msg.u{justify-self:end; background:var(--accent); color:var(--surface)}
.msg.t{background:var(--sunk)}
.msg.t b{display:block; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin-bottom:2px}

/* popovers */
.pop{position:absolute; right:max(16px, env(safe-area-inset-right,0px)); top:calc(100% + 6px); width:min(360px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 12px 32px rgb(0 0 0 / .18); padding:14px 16px; z-index:40}
.pop h3{font-family:var(--f-display); font-size:1rem; margin-bottom:6px}
.toggle{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:.88rem}
.toggle input{width:18px; height:18px; accent-color:var(--accent)}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:.88rem; z-index:90}

.tour{position:fixed; left:16px; top:16px; width:min(370px, calc(100vw - 32px)); background:var(--nav); color:var(--nav-ink); border-radius:12px; padding:16px 18px; z-index:80; box-shadow:0 16px 40px rgb(0 0 0 / .35); transition:top .25s ease, left .25s ease}
.tour .guide{display:flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--nav-muted)}
.tour .guide svg{flex:none}
.tour .step{margin-left:auto; font-family:var(--f-data); color:var(--gold); letter-spacing:0; text-transform:none}
.tour h3{font-family:var(--f-display); color:#fff; font-size:1.12rem; margin:8px 0 6px}
.tour p{margin:0 0 12px; font-size:.88rem; line-height:1.5}
.tour .dots{display:flex; gap:4px; margin:0 0 14px; flex-wrap:wrap}
.tour .dots i{width:6px; height:6px; border-radius:3px; background:var(--nav-active); transition:width .2s}
.tour .dots i.done{background:var(--nav-muted)}
.tour .dots i.on{background:var(--gold); width:18px}
.tour .row{display:flex; justify-content:space-between; align-items:center; gap:8px}
.tour button{background:var(--nav-active); color:#fff; border:0; border-radius:7px; padding:7px 12px; cursor:pointer; font-size:.85rem}
.tour button.pri{background:var(--gold); color:#14202E; font-weight:700}
.tour button.quiet{background:transparent; color:var(--nav-muted); padding-inline:4px}
.tour .keys{font-size:.72rem; color:var(--nav-muted); margin-top:10px}
.spot{position:fixed; z-index:75; border-radius:12px; box-shadow:0 0 0 9999px rgb(8 14 22 / .55); outline:2px solid var(--gold); outline-offset:3px; pointer-events:none; transition:top .25s ease, left .25s ease, width .25s ease, height .25s ease}

.scrim{position:fixed; inset:0; background:rgb(0 0 0 / .45); z-index:45}
/* AI Tutor */
.cando-mark{display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--gold); flex:none}
.cando-mark svg{width:18px; height:18px}
.lesson-grid{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:16px; align-items:start}
.outcome{background:var(--accent-soft); border-radius:8px; padding:10px 14px}
.outcome p{margin:0}
.steps3{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px}
.steps3 li{border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:.84rem; display:flex; gap:8px; align-items:center}
.steps3 b{font-family:var(--f-data); color:var(--gold)}
.chunk{border-top:1px solid var(--line); padding-top:10px}
.chunk h3{font-size:.98rem; margin-bottom:4px}
.chunk p{margin:0; font-size:.9rem}
.task{border:2px solid var(--accent); border-radius:10px; padding:14px; display:grid; gap:10px}
.ai-draft{background:var(--sunk); border-radius:8px; padding:10px 12px; font-size:.9rem; white-space:pre-line; font-family:var(--f-body)}
.ai-draft::before{content:"AI-written draft"; display:block; font-family:var(--f-data); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:4px}
textarea{font:inherit; font-size:.9rem; width:100%; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; resize:vertical}
.btn-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.tutor-side{position:sticky; top:calc(70px + env(safe-area-inset-top,0px)); display:grid; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px}
.tutor-h{display:flex; gap:10px; align-items:center}
.tutor-h h2{font-family:var(--f-display); font-size:1.05rem}
.tutor-h small{display:block; color:var(--muted); font-size:.78rem}
.tchat{display:grid; gap:8px; max-height:340px; overflow-y:auto; padding-right:2px}
.tchat .msg{max-width:100%; font-size:.86rem; padding:8px 12px}
.tchat .msg.t b{color:var(--gold)}
.tchat .msg.p{background:var(--bad-soft); color:var(--ink)}
.tchat .msg.p b{color:var(--bad)}
.tchat .msg.ok{background:var(--good-soft)}
.tchat .msg.ok b{color:var(--good)}
.quick{display:flex; flex-wrap:wrap; gap:6px}
.quick button{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 10px; cursor:pointer; font-size:.8rem}
.quick button:hover{border-color:var(--accent)}
.tform{display:flex; gap:6px}
.tform input{flex:1; min-width:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.tiny{font-size:.76rem; color:var(--muted); margin:0}
.seven{list-style:none; margin:0; padding:0; display:grid; gap:0}
.seven li{display:grid; grid-template-columns:220px minmax(0,1fr); gap:14px; padding:12px 0; border-top:1px solid var(--line)}
.seven li:first-child{border-top:0}
.seven .k{font-weight:600; font-size:.9rem}
.seven .k small{display:block; font-weight:400; color:var(--muted); font-size:.78rem}
.seven .v{font-size:.88rem; background:var(--sunk); border-radius:8px; padding:8px 12px}
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
.rules div{border:1px solid var(--line); border-radius:8px; padding:12px 14px}
.rules h3{font-size:.95rem; margin-bottom:4px}
.rules p{margin:0; font-size:.85rem; color:var(--muted)}
.loop{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; counter-reset:l}
.loop li{counter-increment:l; border:1px solid var(--line); border-radius:8px; padding:12px; font-size:.85rem}
.loop li::before{content:counter(l); display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--accent); color:var(--surface); font-family:var(--f-data); font-size:.75rem; margin-bottom:6px}
.loop b{display:block; margin-bottom:2px}
.tutor-fab{position:fixed; right:max(20px, calc(env(safe-area-inset-right,0px) + 12px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:65; display:flex; align-items:center; gap:8px; background:var(--nav); color:#fff; border:0; border-radius:99px; padding:8px 16px 8px 8px; font-weight:600; cursor:pointer; box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.tutor-fab:focus-visible{outline:3px solid var(--gold)}
.tutor-box{position:fixed; right:max(20px, calc(env(safe-area-inset-right,0px) + 12px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); width:min(380px, calc(100vw - 32px)); max-height:min(540px, calc(100vh - 100px)); z-index:66; display:flex; flex-direction:column; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; box-shadow:0 16px 40px rgb(0 0 0 / .28)}
.tutor-box .tchat{max-height:none; flex:1 1 auto; min-height:80px}
.tutor-box .x{margin-left:auto; background:transparent; border:0; cursor:pointer; font-size:1.1rem; color:var(--muted); padding:4px 8px}

function takeHome(g,o){ const pen=o.pension&&g>=10000?.05*Math.max(0,Math.min(g,50270)-6240):0; const taxable=g-pen; let pa=12570; if(taxable>100000) pa=Math.max(0,pa-(taxable-100000)/2);
 const ti=Math.max(0,taxable-pa); const tax=Math.min(ti,37700)*.2+Math.max(0,Math.min(ti,125140)-37700)*.4+Math.max(0,ti-125140)*.45;
 const ni=Math.max(0,Math.min(g,50270)-12570)*.08+Math.max(0,g-50270)*.02; const loan=o.loan?Math.max(0,g-25000)*.09:0;
 return {g,tax,ni,pen,loan,net:g-tax-ni-pen-loan}; }

function costs(L){ const out=Object.entries(LCOST).map(([k,c])=>{ const o=c.opts.find(x=>x[0]===L[k])||c.opts[0]; return [c.lab,o[2][L.reg],o[1]]; }); if(L.gym) out.push(["Gym",L.reg==="ldn"?45:30,"Membership"]); return out; }
function needGross(month,save,o){ const target=month/(1-save/100)*12; let lo=0,hi=200000; for(let i=0;i<40;i++){ const m=(lo+hi)/2; takeHome(m,o).net>=target?hi=m:lo=m; } return Math.ceil(hi/500)*500; }

const GUIDE_ICON=`<svg width="18" height="18" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 1 L18 12 L29 15 L18 18 L15 29 L12 18 L1 15 L12 12 Z" fill="var(--gold)"/></svg>`;
let ti=-1, tourTarget=null;
function setRole(r){ role=r; $("#roleSel").value=r; $("#avatar").textContent=ROLES[r].init; }
function markSeen(){ try{ localStorage.setItem("ns-dowds-tour-seen","1"); }catch(e){} }
function placeTour(){
  const card=$("#tour"), spot=$("#spot");
  if(card.hidden) return;
  const pad=8, gap=14, cw=card.offsetWidth, ch=card.offsetHeight, W=innerWidth, H=innerHeight;
  if(!tourTarget){ spot.hidden=true; card.style.left=Math.max(16,(W-cw)/2)+"px"; card.style.top=Math.max(16,H-ch-24)+"px"; return; }
  const r=tourTarget.getBoundingClientRect();
  spot.hidden=false;
  Object.assign(spot.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px"});
  let left,top;
  if(W<640){ left=16; top=(r.top>H/2)?16:H-ch-16; }
  else{
    if(r.bottom+pad+gap+ch<H-8) top=r.bottom+pad+gap;
    else if(r.top-pad-gap-ch>8) top=r.top-pad-gap-ch;
    else if(r.left-pad-gap-cw>16){ left=r.left-pad-gap-cw; top=Math.min(Math.max(16,r.top), H-ch-16); }
    else if(r.right+pad+gap+cw<W-16){ left=r.right+pad+gap; top=Math.min(Math.max(16,r.top), H-ch-16); }
    else top=H-ch-16;
    if(left===undefined) left=Math.min(Math.max(16,r.left), W-cw-16);
  }
  card.style.left=left+"px"; card.style.top=Math.max(8,top)+"px";
}
function showStep(){
  const s=TOUR[ti];
  closeTutor();
  if(s.r && s.r!==role) setRole(s.r);
  if(current!==s.v || s.r) render(s.v);
  if(s.on) s.on();
  tourTarget=document.querySelector(s.t);
  if(tourTarget) tourTarget.scrollIntoView({block:"center",behavior:"auto"});
  const last=ti===TOUR.length-1;
  $("#tour").innerHTML=`<div class="guide">${GUIDE_ICON}<span>Your guide</span><span class="step">${ti+1} of ${TOUR.length}</span></div>
   <h3>${s.h}</h3><p>${s.p}</p>
   <div class="dots" aria-hidden="true">${TOUR.map((_,i)=>`<i class="${i===ti?"on":i<ti?"done":""}"></i>`).join("")}</div>
   <div class="row"><button type="button" class="quiet" id="tEnd">End tour</button><span style="display:flex;gap:8px">${ti?`<button type="button" id="tBack">Back</button>`:""}<button type="button" class="pri" id="tNext">${last?"Finish":"Next"}</button></span></div>
   <p class="keys">Use the arrow keys to move, Esc to close.</p>`;
  $("#tour").hidden=false;
  requestAnimationFrame(()=>{ placeTour(); $("#tNext").focus({preventScroll:true}); });
}
function startTour(){ hidePops(); closeNav(); markSeen(); ti=0; showStep(); }
function endTour(done){ closeTutor(); $("#tour").hidden=true; $("#spot").hidden=true; tourTarget=null; ti=-1; markSeen(); if(done) toast("Tour complete. Restart it any time from Guided tour."); }
function offerTour(){
  ti=-1; tourTarget=null;
  $("#tour").innerHTML=`<div class="guide">${GUIDE_ICON}<span>Your guide</span></div><h3>New to North Star?</h3><p>Take a three-minute tour of how it supports skills and training across Dowds Group, from site safety to the AI Tutor.</p><div class="row"><button type="button" class="quiet" id="tSkip">Explore on my own</button><button type="button" class="pri" id="tGo">Take the tour</button></div>`;
  $("#tour").hidden=false; requestAnimationFrame(placeTour);
}
$("#tourStart").addEventListener("click",startTour);
$("#tourTop").addEventListener("click",startTour);
$("#tour").addEventListener("click",e=>{
  const id=e.target.id;
  if(id==="tEnd") endTour(false);
  else if(id==="tSkip") endTour(false);
  else if(id==="tGo") startTour();
  else if(id==="tBack"){ ti--; showStep(); }
  else if(id==="tNext"){ if(ti<TOUR.length-1){ ti++; showStep(); } else endTour(true); }
});
document.addEventListener("keydown",e=>{
  if(ti<0||$("#tour").hidden) return;
  if(e.key==="Escape") endTour(false);
  else if(e.key==="ArrowRight"){ e.preventDefault(); if(ti<TOUR.length-1){ ti++; showStep(); } else endTour(true); }
  else if(e.key==="ArrowLeft" && ti>0){ e.preventDefault(); ti--; showStep(); }
});
addEventListener("resize",placeTour);
addEventListener("scroll",placeTour,{passive:true});
document.addEventListener("click",e=>{ if(ti>=0 && e.target.closest("[data-view]") && !e.target.closest("#tour")) endTour(false); },true);

renderNav();
const start=(location.hash||"").slice(1);
if(start==="tour"){ render("home"); startTour(); }
else{ render(start||"home"); let seen=false; try{ seen=!!localStorage.getItem("ns-dowds-tour-seen"); }catch(e){} if(!seen&&start!=="aisim") offerTour(); simMaybeAuto(); }
})();
</script>


</body></html>
