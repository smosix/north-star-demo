  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 700; text-decoration: none; padding: 7px 12px; border-radius: 999px; color: #FFFFFF; background: #26235E;\">A day on site\u003c/a>\u003ca href=\"HowItWorks.dc.html\" aria-current=\"page\" style=\"font-size: 14px; font-weight: 700; text-decoration: none; padding: 7px 12px; border-radius: 999px; color: #121036; background: #7FD6DF;\">One post, five days\u003c/a>\u003c/nav>\n\u003c/div>\n\u003c/div>\n\u003c/header>\n\u003csc-if value=\"{{ tourMax }}\" hint-placeholder-val=\"{{ true }}\">\n\u003caside aria-label=\"Feature tour guide\" style=\"position: fixed; right: 20px; bottom: 20px; z-index: 60; width: min(380px, calc(100vw - 40px)); background: #121036; color: #E2E4F5; border-radius: 16px; box-shadow: 0 16px 40px rgba(18, 16, 54, 0.45);\">\n\u003cdiv style=\"padding: 14px 18px; display: flex; align-items: center; gap: 10px;\">\u003cimg src=\"0d435a64-0db6-4dae-923c-b95243cdd448\" alt=\"\" style=\"width: 28px; height: 28px; border-radius: 7px;\">\u003cspan style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9FA4C9; font-weight: 700;\">Feature tour\u003c/span>\u003cspan style=\"font-size: 13px; color: #F5C542; font-weight: 700;\">Stop 4 of 12\u003c/span>\u003cbutton type=\"button\" sc-camel-on-click=\"{{ tourMinimise }}\" aria-label=\"Minimise tour\" style=\"margin-left: auto; background: #26235E; border: 0; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 12px; border-radius: 999px; min-height: 36px;\">– Minimise\u003c/button>\u003c/div>\n\u003cdiv style=\"padding: 0 18px 18px; display: flex; flex-direction: column; gap: 10px;\">\n\u003cb style=\"font-family: Poppins, Arial, sans-serif; font-size: 20px; color: #FFFFFF;\">One post, five days\u003c/b>\n\u003col style=\"margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.55;\">\u003cli>Pick a day to see its spotlight role, science link and skill drill\u003c/li>\u003cli>Compare the live construction VWE with the heritage version\u003c/li>\u003cli>See the evidence report learners apply with\u003c/li>\u003c/ol>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\u003ca href=\"Simulation.dc.html\" style=\"background: #26235E; color: #FFFFFF; padding: 9px 14px; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 700;\">← A day on site\u003c/a>\u003cspan style=\"flex: 1;\">\u003c/span>\u003ca href=\"Planner.dc.html\" style=\"background: #F5C542; color: #121036; padding: 9px 14px; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 700;\">Next: Careers planner →\u003c/a>\u003c/div>\n\u003c/div>\n\u003c/aside>\n\u003c/sc-if>\n\u003csc-if value=\"{{ tourMin }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cbutton type=\"button\" sc-camel-on-click=\"{{ tourExpand }}\" aria-label=\"Open the feature tour\" style=\"position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 10px; background: #121036; color: #FFFFFF; border: 0; border-radius: 999px; padding: 8px 16px 8px 8px; font-weight: 700; font-size: 14px; cursor: pointer;\">\u003cimg src=\"0d435a64-0db6-4dae-923c-b95243cdd448\" alt=\"\" style=\"width: 30px; height: 30px; border-radius: 50%;\">Feature tour · stop 4 of 12 \u003cspan style=\"color: #F5C542;\">+ Show\u003c/span>\u003c/button>\n\u003c/sc-if>\n\n\u003csection style=\"background: #1C1A4A; color: #FFFFFF;\">\n\u003cdiv style=\"max-width: 1240px; margin: 0 auto; padding: 40px 24px 28px; display: flex; flex-direction: column; gap: 14px;\">\n\u003cp style=\"margin: 0; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7FD6DF; font-weight: 700;\">How it works\u003c/p>\n\u003ch1 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 40px; line-height: 1.1;\">One post, five days, on a living site\u003c/h1>\n\u003cp style=\"margin: 0; font-size: 18px; color: #D9DCF2; max-width: 760px;\">Every VWE follows the same five-day arc around one craft, so schools know what to expect. Funded sites give the setting, Developing Experts lessons give the science, and makers give the role models.\u003c/p>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 6px;\">\n\u003cdiv style=\"background: #26235E; border-radius: 12px; padding: 14px 16px;\">\u003cb style=\"display: block; font-family: Poppins, Arial, sans-serif; font-size: 26px; color: #F5C542;\">300\u003c/b>\u003cspan style=\"font-size: 14px; color: #D9DCF2;\">minutes of learning in the live construction Day 1\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #26235E; border-radius: 12px; padding: 14px 16px;\">\u003cb style=\"display: block; font-family: Poppins, Arial, sans-serif; font-size: 26px; color: #F5C542;\">42\u003c/b>\u003cspan style=\"font-size: 14px; color: #D9DCF2;\">guided steps\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #26235E; border-radius: 12px; padding: 14px 16px;\">\u003cb style=\"display: block; font-family: Poppins, Arial, sans-serif; font-size: 26px; color: #F5C542;\">8\u003c/b>\u003cspan style=\"font-size: 14px; color: #D9DCF2;\">videos with real staff\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #26235E; border-radius: 12px; padding: 14px 16px;\">\u003cb style=\"display: block; font-family: Poppins, Arial, sans-serif; font-size: 26px; color: #F5C542;\">93,000+\u003c/b>\u003cspan style=\"font-size: 14px; color: #D9DCF2;\">360° tour views\u003c/span>\u003c/div>\n\u003c/div>\n\u003cp style=\"margin: 0; font-size: 12px; color: #9FA4C9;\">Figures from the live Morgan Sindall Construction VWE, Day 1, the proven model the heritage VWEs follow.\u003c/p>\n\u003c/div>\n\u003c/section>\n\n\u003cdiv style=\"max-width: 1240px; margin: 0 auto; padding: 24px 24px 56px; display: flex; flex-direction: column; gap: 22px;\">\n\n\u003csection aria-labelledby=\"days-h\" style=\"display: flex; flex-direction: column; gap: 14px;\">\n\u003ch2 id=\"days-h\" style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 26px;\">Worked example: the Heritage Stonemason VWE\u003c/h2>\n\u003cnav aria-label=\"Days\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px;\">\n\u003csc-for list=\"{{ dayTabs }}\" as=\"t\" hint-placeholder-count=\"5\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ t.go }}\" aria-current=\"{{ t.current }}\" style=\"{{ t.style }}\">\u003cspan style=\"{{ t.numStyle }}\">{{ t.n }}\u003c/span>\u003cspan style=\"display: flex; flex-direction: column; text-align: left;\">\u003cb style=\"font-size: 15px;\">{{ t.name }}\u003c/b>\u003cspan style=\"font-size: 13px; opacity: 0.85;\">Day {{ t.n }}\u003c/span>\u003c/span>\u003c/button>\u003c/sc-for>\n\u003c/nav>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 18px; padding: 26px; display: flex; flex-wrap: wrap; gap: 20px;\">\n\u003cdiv style=\"flex: 999 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 10px;\">\n\u003cp style=\"margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #0B7D8A; font-weight: 700;\">Day {{ day.n }} · {{ day.theme }}\u003c/p>\n\u003ch3 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 24px;\">{{ day.name }}\u003c/h3>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4D5170;\">{{ day.body }}\u003c/p>\n\u003csc-if value=\"{{ day.isOne }}\" hint-placeholder-val=\"{{ true }}\">\u003ca href=\"Simulation.dc.html\" style=\"align-self: flex-start; background: #1AA5B5; color: #FFFFFF; font-weight: 700; padding: 11px 18px; border-radius: 999px; text-decoration: none;\">Try Day 1 now\u003c/a>\u003c/sc-if>\n\u003c/div>\n\u003cdiv style=\"flex: 1 1 300px; min-width: 0; display: grid; gap: 10px;\">\n\u003cdiv style=\"background: #FFF6DA; border-radius: 12px; padding: 12px 14px;\">\u003cspan style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6B4C00;\">Spotlight role\u003c/span>\u003cb style=\"display: block; font-size: 16px;\">{{ day.role }}\u003c/b>\u003c/div>\n\u003cdiv style=\"background: #E3F4F6; border-radius: 12px; padding: 12px 14px;\">\u003cspan style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #075E68;\">Science link\u003c/span>\u003cb style=\"display: block; font-size: 16px;\">{{ day.sci }}\u003c/b>\u003c/div>\n\u003cdiv style=\"background: #EEF3F5; border-radius: 12px; padding: 12px 14px;\">\u003cspan style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4D5170;\">Skill drill\u003c/span>\u003cb style=\"display: block; font-size: 16px;\">{{ day.drill }}\u003c/b>\u003c/div>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"beats-h\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n\u003ch2 id=\"beats-h\" style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 26px;\">The ten beats of a VWE day\u003c/h2>\n\u003cp style=\"margin: 0; font-size: 16px; color: #4D5170;\">Every day follows the same ten beats, which is what makes the model repeatable across 42 crafts.\u003c/p>\n\u003col style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;\">\n\u003csc-for list=\"{{ beats }}\" as=\"b\" hint-placeholder-count=\"10\">\u003cli style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: center;\">\u003cspan style=\"width: 34px; height: 34px; flex: none; border-radius: 50%; background: #1C1A4A; color: #F5C542; display: grid; place-items: center; font-weight: 700; font-size: 13px;\">{{ b.n }}\u003c/span>\u003cb style=\"font-size: 15px;\">{{ b.t }}\u003c/b>\u003c/li>\u003c/sc-for>\n\u003c/ol>\n\u003c/section>\n\n\u003csection aria-labelledby=\"same-h\" style=\"display: flex; flex-direction: column; gap: 12px;\">\n\u003ch2 id=\"same-h\" style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 26px;\">Same model, heritage content\u003c/h2>\n\u003cdiv style=\"overflow-x: auto; background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 14px;\">\n\u003csc-raw-table style=\"width: 100%; min-width: 720px; border-collapse: collapse; font-size: 15px;\">\n\u003csc-raw-thead>\u003csc-raw-tr style=\"background: #1C1A4A; color: #FFFFFF; text-align: left;\">\u003csc-raw-th scope=\"col\" style=\"padding: 12px 14px;\">Beat\u003c/sc-raw-th>\u003csc-raw-th scope=\"col\" style=\"padding: 12px 14px;\">Morgan Sindall Construction (live)\u003c/sc-raw-th>\u003csc-raw-th scope=\"col\" style=\"padding: 12px 14px;\">Heritage Stonemason (proposed)\u003c/sc-raw-th>\u003c/sc-raw-tr>\u003c/sc-raw-thead>\n\u003csc-raw-tbody>\u003csc-for list=\"{{ compare }}\" as=\"c\" hint-placeholder-count=\"7\">\u003csc-raw-tr style=\"border-top: 1px solid #E2EAED;\">\u003csc-raw-th scope=\"row\" style=\"padding: 12px 14px; text-align: left;\">{{ c.a }}\u003c/sc-raw-th>\u003csc-raw-td style=\"padding: 12px 14px; color: #4D5170;\">{{ c.b }}\u003c/sc-raw-td>\u003csc-raw-td style=\"padding: 12px 14px;\">{{ c.c }}\u003c/sc-raw-td>\u003c/sc-raw-tr>\u003c/sc-for>\u003c/sc-raw-tbody>\n\u003c/sc-raw-table>\n\u003c/div>\n\u003c/section>\n\n\u003csection aria-labelledby=\"ev-h\" style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 18px; padding: 26px; display: flex; flex-wrap: wrap; gap: 24px;\">\n\u003cdiv style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px;\">\n\u003cp style=\"margin: 0; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #0B7D8A; font-weight: 700;\">After five days\u003c/p>\n\u003ch2 id=\"ev-h\" style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 26px;\">An evidence report and portfolio to apply with\u003c/h2>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #4D5170;\">Learners finish with a certificate co-branded with the heritage partner, a portfolio of site diary entries and drawings, and a report of the skills they showed. Small workshops and makers see what a young person can do, not who they know.\u003c/p>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\u003ca href=\"Partners.dc.html\" style=\"background: #F5C542; color: #121036; font-weight: 700; padding: 11px 18px; border-radius: 999px; text-decoration: none;\">See opportunities\u003c/a>\u003ca href=\"Planner.dc.html\" style=\"border: 2px solid #1C1A4A; color: #1C1A4A; font-weight: 700; padding: 9px 18px; border-radius: 999px; text-decoration: none;\">Plan my route\u003c/a>\u003c/div>\n\u003c/div>\n\u003cdiv style=\"flex: 1 1 360px; min-width: 0; border: 2px solid #1AA5B5; border-radius: 16px; overflow: hidden;\">\n\u003cdiv style=\"background: #1C1A4A; color: #FFFFFF; padding: 12px 16px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px;\">\u003cb style=\"font-family: Poppins, Arial, sans-serif;\">Evidence report · example learner\u003c/b>\u003cspan style=\"font-size: 13px; color: #B9E6EB;\">Heritage Stonemason VWE · 5 days\u003c/span>\u003c/div>\n\u003cdiv style=\"padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;\">\n\u003csc-for list=\"{{ skills }}\" as=\"sk\" hint-placeholder-count=\"5\">\u003cdiv style=\"display: flex; flex-direction: column; gap: 3px;\">\u003cspan style=\"display: flex; justify-content: space-between; font-size: 14px;\">\u003cspan>{{ sk.t }}\u003c/span>\u003cb>{{ sk.v }}\u003c/b>\u003c/span>\u003cspan style=\"display: block; height: 6px; background: #E2EAED; border-radius: 3px; overflow: hidden;\">\u003cspan style=\"{{ sk.bar }}\">\u003c/span>\u003c/span>\u003c/div>\u003c/sc-for>\n\u003cp style=\"margin: 4px 0 0; background: #FFF6DA; border-radius: 10px; padding: 10px 12px; font-style: italic; font-size: 14px; line-height: 1.5;\">“I didn’t know you could repair a carved stone instead of replacing it. Mixing lime to the specification was harder than it looks.”\u003c/p>\n\u003cspan style=\"font-size: 12px; color: #4D5170;\">Illustrative example, not a real learner.\u003c/span>\n\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003c/div>\n\n\u003cfooter style=\"background: #121036; color: #C5C9E6;\">\n\u003cdiv style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; font-size: 14px;\">\n\u003cspan>Delivered by Developing Experts with the Heritage Crafts Industry. Concept mock-up.\u003c/span>\n\u003cspan>\u003ca href=\"Reports.dc.html\" style=\"color: #7FD6DF;\">Partner sign-in\u003c/a> · \u003ca href=\"Main.dc.html#accessibility\" style=\"color: #7FD6DF;\">Accessibility\u003c/a> · Privacy · Safeguarding\u003c/span>\n\u003c/div>\n\u003c/footer>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:2200}}\">\nconst DAYS = [\n  ['The project and the post','Discover the site','Heritage Stonemason','Conservation and the repair process','Spot the stone decay','A 360° tour of a scaffolded Heritage at Risk church tower. Meet the church council, Historic England and the conservation architect, learn the conservation cycle, allocate the grant budget and write a press release.'],\n  ['Stone and science','Meet the makers','Conservation architect','Rocks, weathering and acid rain','Identify limestone, sandstone and granite','Why stone decays, how a condition survey is read, and how the architect decides what can be repaired and what must be replaced.'],\n  ['The lime cycle','The science of the craft','Lime plasterer','Chemical reactions: limestone to lime and back','Mix a mortar to specification','The chemistry of the limestone cycle and why breathable lime, not cement, keeps old walls healthy.'],\n  ['Carving and setting out','Hands-on skill drills','Banker mason and apprentice','Geometry, forces and arches','Set out a template from a drawing','How masons turn a drawing into a template, and how arches carry load. Meet an apprentice two years into training.'],\n  ['Your pathway','Pathways and certificate','Cathedrals’ Workshop Fellow','AI career pathway and CV builder','Certificate and next-step plan','Real routes in: the Stonemason (Level 3) apprenticeship, the Building Crafts College and the Cathedrals’ Workshop Fellowship. Build a next-step plan and earn the certificate.']\n];\nconst BEATS = ['Arrive on site','Meet the organisations','Bust the myths','Learn the process','Client kick-off','Real tasks','Meet the team','Spotlight role','Skill drill','Reflection diary'];\nconst COMPARE = [\n  ['The process','RIBA Plan of Work, stages 0 to 7','The conservation cycle: survey, significance, specification, consent, repair, record'],\n  ['The client','Kick-off with LS Estates','Kick-off with the church council and Historic England grant officer'],\n  ['The project','17 Columbus Courtyard retrofit, Canary Wharf','Tower repair at a Heritage at Risk parish church (case study)'],\n  ['The budget','£80m tracker with contingency','£650,000 grant, close to the average Heritage at Risk Capital Fund award'],\n  ['The big question','Retrofit or new build?','Repair or replace? Like-for-like stone and embodied carbon'],\n  ['The spotlight role','Design Manager reads drawings','Heritage Stonemason reads a stone condition survey'],\n  ['The skill drill','Drawing tolerance simulation','Spot the stone decay simulation']\n];\nconst SKILLS = [['Material knowledge',88],['Safety awareness',92],['Accuracy and care',85],['Communication',80],['Problem solving',83]];\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { d: 0 }; }\n  renderVals() {\n    const s = this.state, D = DAYS[s.d];\n    let mn = s.tourMin; if (mn === undefined) { try { mn = sessionStorage.getItem('hcTourMin') === '1'; } catch (x) { mn = false; } }\n    return {\n      tourMin: !!mn, tourMax: !mn,\n \"s16\", \"Teacher training\": \"s17\", \"Lesson unit library\": \"s18\", \"School sign-up\": \"s19\"}, LS='heritageNar', PRE='../';\nvar aud=new Audio(); aud.preload='auto';\nvar on=true; try{on=localStorage.getItem(LS)!=='0';}catch(e){}\nvar last=null, btn=null, cur=null, timer=0, shown='';\nfunction panel(){return document.querySelector('aside[aria-label=\"Virtual tour of features\"],aside[aria-label=\"Feature tour guide\"],aside[aria-label=\"Feature tour\"]');}\nfunction titleOf(p){var b=p.querySelector('b');return b?b.textContent.trim():'';}\nfunction fmt(d){d=Math.round(d||0);return Math.floor(d/60)+':'+('0'+d%60).slice(-2);}\nfunction clip(t){var k=KEYS[t],A=window.__NT_AUDIO||{};return k&&A[k]?A[k]:null;}\nfunction label(){if(!btn)return;var s=(on?'🔊 Narration on':'🔇 Narration off')+(cur?' · '+fmt(cur.dur):'');if(s!==shown){shown=s;btn.textContent=s;}btn.setAttribute('aria-pressed',on);}\nfunction play(){aud.pause();if(!on||!cur)return;aud.src=PRE+cur.src;aud.currentTime=0;var pr=aud.play();if(pr&&pr.catch)pr.catch(function(){});}\nfunction place(p){var r=p.getBoundingClientRect();btn.style.bottom=(window.innerHeight-r.top+8)+'px';btn.style.right=Math.max(8,window.innerWidth-r.right)+'px';}\nfunction sync(){\n  var p=panel();\n  if(!p){if(last!==null){aud.pause();last=null;cur=null;}if(btn)btn.style.display='none';return;}\n  var t=titleOf(p);\n  if(t!==last){last=t;cur=clip(t);play();}\n  if(!btn){btn=document.createElement('button');btn.type='button';btn.id='ntNar';\n    btn.style.cssText='position:fixed;z-index:9999;background:#121036;color:#fff;border:2px solid #F5C542;border-radius:999px;padding:8px 14px;font:700 13px/1 system-ui,sans-serif;cursor:pointer;min-height:36px';\n    btn.onclick=function(){on=!on;try{localStorage.setItem(LS,on?'1':'0');}catch(e){}label();if(on)play();else aud.pause();};\n    document.body.appendChild(btn);}\n  btn.style.display=cur?'':'none';label();place(p);\n}\nfunction later(){clearTimeout(timer);timer=setTimeout(sync,80);}\nnew MutationObserver(later).observe(document.body,{childList:true,subtree:true,characterData:true});\nwindow.addEventListener('hashchange',later);window.addEventListener('resize',later);\ndocument.addEventListener('DOMContentLoaded',later);later();\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"
