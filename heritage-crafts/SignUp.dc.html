  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

us: 8px;\">Try a VWE\u003c/a>\n\u003ca href=\"Planner.dc.html\" style=\"color: #FFFFFF; text-decoration: none; padding: 10px 12px; border-radius: 8px;\">Plan my future\u003c/a>\n\u003ca href=\"Teachers.dc.html\" aria-current=\"true\" style=\"color: #121036; background: #F5C542; text-decoration: none; padding: 10px 12px; border-radius: 8px;\">For teachers and partners\u003c/a>\n\u003c/nav>\n\u003c/div>\n\u003cdiv style=\"background: #1C1A4A; border-top: 1px solid #3A367A;\">\n\u003cdiv style=\"max-width: 1240px; margin: 0 auto; padding: 8px 24px;\">\u003cp style=\"margin: 0; font-size: 14px; color: #B9E6EB;\">\u003ca href=\"Main.dc.html\" style=\"color: #B9E6EB;\">Home\u003c/a> › For teachers › \u003cb style=\"color: #FFFFFF;\">School sign-up\u003c/b>\u003c/p>\u003c/div>\n\u003c/div>\n\u003c/header>\n\u003csc-if value=\"{{ tourMax }}\" hint-placeholder-val=\"{{ true }}\">\n\u003caside aria-label=\"Feature tour guide\" style=\"position: fixed; right: 20px; bottom: 20px; z-index: 60; width: min(380px, calc(100vw - 40px)); background: #121036; color: #E2E4F5; border-radius: 16px; box-shadow: 0 16px 40px rgba(18, 16, 54, 0.45);\">\n\u003cdiv style=\"padding: 14px 18px; display: flex; align-items: center; gap: 10px;\">\u003cimg src=\"db248f20-4394-4d01-82c2-773328fb7f0e\" alt=\"\" style=\"width: 28px; height: 28px; border-radius: 7px;\">\u003cspan style=\"font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #9FA4C9; font-weight: 700;\">Feature tour\u003c/span>\u003cspan style=\"font-size: 13px; color: #F5C542; font-weight: 700;\">Stop 12 of 12\u003c/span>\u003cbutton type=\"button\" sc-camel-on-click=\"{{ tourMinimise }}\" aria-label=\"Minimise tour\" style=\"margin-left: auto; background: #26235E; border: 0; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 12px; border-radius: 999px; min-height: 36px;\">– Minimise\u003c/button>\u003c/div>\n\u003cdiv style=\"padding: 0 18px 18px; display: flex; flex-direction: column; gap: 10px;\">\n\u003cb style=\"font-family: Poppins, Arial, sans-serif; font-size: 20px; color: #FFFFFF;\">School sign-up\u003c/b>\n\u003col style=\"margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.55;\">\u003cli>Work through the four steps\u003c/li>\u003cli>See how learning data is kept safe\u003c/li>\u003c/ol>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\u003ca href=\"Units.dc.html\" style=\"background: #26235E; color: #FFFFFF; padding: 9px 14px; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 700;\">← Unit library\u003c/a>\u003cspan style=\"flex: 1;\">\u003c/span>\u003ca href=\"Main.dc.html\" style=\"background: #F5C542; color: #121036; padding: 9px 14px; border-radius: 999px; text-decoration: none; font-size: 14px; font-weight: 700;\">Finish: back home →\u003c/a>\u003c/div>\n\u003c/div>\n\u003c/aside>\n\u003c/sc-if>\n\u003csc-if value=\"{{ tourMin }}\" hint-placeholder-val=\"{{ false }}\">\n\u003cbutton type=\"button\" sc-camel-on-click=\"{{ tourExpand }}\" aria-label=\"Open the feature tour\" style=\"position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 10px; background: #121036; color: #FFFFFF; border: 0; border-radius: 999px; padding: 8px 16px 8px 8px; font-weight: 700; font-size: 14px; cursor: pointer;\">\u003cimg src=\"db248f20-4394-4d01-82c2-773328fb7f0e\" alt=\"\" style=\"width: 30px; height: 30px; border-radius: 50%;\">Feature tour · stop 12 of 12 \u003cspan style=\"color: #F5C542;\">+ Show\u003c/span>\u003c/button>\n\u003c/sc-if>\n\n\u003csection style=\"background: #1C1A4A; color: #FFFFFF;\">\n\u003cdiv style=\"max-width: 1240px; margin: 0 auto; padding: 40px 24px 32px; display: flex; flex-wrap: wrap; gap: 28px; align-items: center;\">\n\u003cdiv style=\"flex: 999 1 480px; display: flex; flex-direction: column; gap: 12px;\">\n\u003cp style=\"margin: 0; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7FD6DF; font-weight: 700;\">School sign-up\u003c/p>\n\u003ch1 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 38px; line-height: 1.15;\">Sign up your school for the free heritage lesson unit library\u003c/h1>\n\u003cp style=\"margin: 0; font-size: 17px; color: #D9DCF2;\">VWEs are free for everyone. Signing up adds sequenced science lessons that lead into each VWE, class tracking and Gatsby Benchmark evidence, sponsored by heritage funding partners.\u003c/p>\n\u003c/div>\n\u003cimg src=\"ddd321ab-cd36-4f3b-bcab-136da53c9ab9\" alt=\"A group of secondary school pupils laugh together in a school corridor\" style=\"flex: 1 1 300px; min-width: 0; width: 100%; max-width: 420px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px;\">\n\u003c/div>\n\u003c/section>\n\n\u003cmain style=\"max-width: 860px; margin: 0 auto; padding: 32px 24px 8px;\">\n\u003cdiv style=\"display: flex; gap: 6px; margin-bottom: 14px;\" aria-hidden=\"true\">\u003csc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"4\">\u003cspan style=\"{{ d.style }}\">\u003c/span>\u003c/sc-for>\u003c/div>\n\u003csection aria-live=\"polite\" style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 14px;\">\n\u003csc-if value=\"{{ s0 }}\" hint-placeholder-val=\"{{ true }}\">\n\u003ch2 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 22px;\">Step 1: check your school is eligible\u003c/h2>\n\u003clabel for=\"nat\" style=\"font-size: 14px; font-weight: 700;\">Nation\u003c/label>\n\u003csc-raw-select id=\"nat\" sc-camel-on-change=\"{{ setNat }}\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; background: #FFFFFF; font-size: 16px;\">\u003coption value=\"\">Choose…\u003c/option>\u003coption value=\"England\">England\u003c/option>\u003coption value=\"Wales\">Wales\u003c/option>\u003coption value=\"Scotland\">Scotland\u003c/option>\u003coption value=\"Northern Ireland\">Northern Ireland\u003c/option>\u003c/sc-raw-select>\n\u003clabel for=\"phase\" style=\"font-size: 14px; font-weight: 700;\">Phase\u003c/label>\n\u003csc-raw-select id=\"phase\" sc-camel-on-change=\"{{ setPhase }}\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; background: #FFFFFF; font-size: 16px;\">\u003coption value=\"\">Choose…\u003c/option>\u003coption value=\"Primary\">Primary\u003c/option>\u003coption value=\"Secondary\">Secondary\u003c/option>\u003coption value=\"All-through\">All-through\u003c/option>\u003coption value=\"College\">FE college or sixth form\u003c/option>\u003coption value=\"Special\">Special school or AP\u003c/option>\u003c/sc-raw-select>\n\u003csc-if value=\"{{ eligShown }}\" hint-placeholder-val=\"{{ false }}\">\u003cdiv style=\"background: #E0F3E8; color: #14532D; border-radius: 12px; padding: 12px 14px; font-size: 15px;\">✓ {{ eligMsg }}\u003c/div>\u003c/sc-if>\n\u003c/sc-if>\n\u003csc-if value=\"{{ s1 }}\" hint-placeholder-val=\"{{ false }}\">\n\u003ch2 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 22px;\">Step 2: your school\u003c/h2>\n\u003clabel for=\"sch\" style=\"font-size: 14px; font-weight: 700;\">School or college name\u003c/label>\n\u003cinput id=\"sch\" type=\"text\" sc-camel-on-change=\"{{ setSchool }}\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; font-size: 16px;\">\n\u003clabel for=\"pc\" style=\"font-size: 14px; font-weight: 700;\">Postcode\u003c/label>\n\u003cinput id=\"pc\" type=\"text\" autocomplete=\"postal-code\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; font-size: 16px; max-width: 220px;\">\n\u003cspan style=\"font-size: 14px; font-weight: 700;\">Which domains interest you most?\u003c/span>\n\u003cdiv role=\"group\" aria-label=\"Domains of interest\" style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\u003csc-for list=\"{{ doms }}\" as=\"d\" hint-placeholder-count=\"7\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ d.pick }}\" aria-pressed=\"{{ d.pressed }}\" style=\"{{ d.style }}\">{{ d.t }}\u003c/button>\u003c/sc-for>\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ false }}\">\n\u003ch2 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 22px;\">Step 3: your details\u003c/h2>\n\u003clabel for=\"fn\" style=\"font-size: 14px; font-weight: 700;\">First name\u003c/label>\n\u003cinput id=\"fn\" type=\"text\" autocomplete=\"given-name\" sc-camel-on-change=\"{{ setFirst }}\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; font-size: 16px;\">\n\u003clabel for=\"role\" style=\"font-size: 14px; font-weight: 700;\">Your role\u003c/label>\n\u003csc-raw-select id=\"role\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; background: #FFFFFF; font-size: 16px;\">\u003coption>Careers lead\u003c/option>\u003coption>Head of science\u003c/option>\u003coption>Science teacher\u003c/option>\u003coption>Senior leader\u003c/option>\u003coption>Other\u003c/option>\u003c/sc-raw-select>\n\u003clabel for=\"wem\" style=\"font-size: 14px; font-weight: 700;\">School email\u003c/label>\n\u003cinput id=\"wem\" type=\"email\" autocomplete=\"email\" style=\"padding: 12px; border-radius: 10px; border: 1px solid #C7D3D8; font-size: 16px;\">\n\u003c/sc-if>\n\u003csc-if value=\"{{ s3 }}\" hint-placeholder-val=\"{{ false }}\">\n\u003ch2 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 22px;\">Step 4: set up your school\u003c/h2>\n\u003csc-for list=\"{{ setup }}\" as=\"o\" hint-placeholder-count=\"4\">\u003cbutton type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.pressed }}\" style=\"{{ o.style }}\">\u003cspan>{{ o.box }}\u003c/span>\u003cspan style=\"flex: 1; text-align: left;\">{{ o.t }}\u003c/span>\u003c/button>\u003c/sc-for>\n\u003c/sc-if>\n\u003csc-if value=\"{{ s4 }}\" hint-placeholder-val=\"{{ false }}\">\n\u003ch2 style=\"margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 24px;\">You’re signed up, {{ firstName }}\u003c/h2>\n\u003cp style=\"margin: 0; font-size: 16px; line-height: 1.55; color: #4D5170;\">{{ doneMsg }}\u003c/p>\n\u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\u003ca href=\"Units.dc.html\" style=\"background: #1C1A4A; color: #FFFFFF; font-weight: 700; padding: 12px 18px; border-radius: 999px; text-decoration: none;\">Open the unit library\u003c/a>\u003ca href=\"Teachers.dc.html\" style=\"border: 2px solid #1AA5B5; color: #0B7D8A; font-weight: 700; padding: 10px 18px; border-radius: 999px; text-decoration: none;\">Start teacher training\u003c/a>\u003c/div>\n\u003c/sc-if>\n\u003csc-if value=\"{{ showNav }}\" hint-placeholder-val=\"{{ true }}\">\n\u003cdiv style=\"display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid #D5DEE2; padding-top: 14px;\">\n\u003cbutton type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"background: none; border: 2px solid #C7D3D8; color: #1C1A4A; border-radius: 999px; padding: 10px 18px; font-weight: 700; cursor: pointer;\">← Back\u003c/button>\n\u003cbutton type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"background: #1AA5B5; color: #FFFFFF; border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; cursor: pointer;\">{{ nextLabel }}\u003c/button>\n\u003c/div>\n\u003c/sc-if>\n\u003c/section>\n\u003c/main>\n\n\u003csection aria-labelledby=\"data-h\" style=\"max-width: 1240px; margin: 0 auto; padding: 36px 24px 56px;\">\n\u003ch2 id=\"data-h\" style=\"margin: 0 0 14px; font-family: Poppins, Arial, sans-serif; font-size: 24px;\">How we track learning data safely\u003c/h2>\n\u003cdiv style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;\">\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 14px; padding: 16px;\">\u003cb style=\"display: block; font-size: 16px;\">GDPR-compliant\u003c/b>\u003cspan style=\"font-size: 14px; color: #4D5170;\">Your school is the data controller; Developing Experts processes data on your behalf.\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 14px; padding: 16px;\">\u003cb style=\"display: block; font-size: 16px;\">Anonymised for partners\u003c/b>\u003cspan style=\"font-size: 14px; color: #4D5170;\">Funders and heritage partners only see aggregated figures, never names.\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 14px; padding: 16px;\">\u003cb style=\"display: block; font-size: 16px;\">Mediated contact\u003c/b>\u003cspan style=\"font-size: 14px; color: #4D5170;\">Learners and makers never exchange personal contact details.\u003c/span>\u003c/div>\n\u003cdiv style=\"background: #FFFFFF; border: 1px solid #D5DEE2; border-radius: 14px; padding: 16px;\">\u003cb style=\"display: block; font-size: 16px;\">Gatsby-mapped markbook\u003c/b>\u003cspan style=\"font-size: 14px; color: #4D5170;\">Every taster and VWE is recorded as a Gatsby Benchmark encounter.\u003c/span>\u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003cfooter style=\"background: #121036; color: #C5C9E6;\">\n\u003cdiv style=\"max-width: 1240px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; font-size: 14px;\">\n\u003cspan>Delivered by Developing Experts with the Heritage Crafts Industry. Concept mock-up.\u003c/span>\n\u003cspan>\u003ca href=\"Reports.dc.html\" style=\"color: #7FD6DF;\">Partner sign-in\u003c/a> · \u003ca href=\"Main.dc.html#accessibility\" style=\"color: #7FD6DF;\">Accessibility\u003c/a> · Privacy\u003c/span>\n\u003c/div>\n\u003c/footer>\n\u003c/div>\n\u003c/x-dc>\n\u003cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3200}}\">\nconst DOMS = ['Built Heritage','Wood & Living Materials','Metal & Precision','Fire & Earth','Fibre & Hide','Art, Word & Sound','Journeys & Engineering'];\nconst SETUP = ['Invite my science department','Add class lists from our MIS','Use the Welsh-language version','Send me printable handouts for offline delivery'];\nclass Component extends DCLogic {\n  constructor(props) { super(props); this.state = { step: 0, nat: '', phase: '', school: '', first: '', doms: {}, setup: {} }; }\n  renderVals() {\n    const s = this.state;\n    const chip = (on) => 'min-height:40px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;border:2px solid #1C1A4A;' + (on ? 'background:#1C1A4A;color:#FFFFFF' : 'background:#FFFFFF;color:#1C1A4A');\n    const picked = DOMS.filter(d => s.doms[d]);\n    let mn = s.tourMin; if (mn === undefined) { try { mn = sessionStorage.getItem('hcTourMin') === '1'; } catch (x) { mn = false; } }\n    return {\n      tourMin: !!mn, tourMax: !mn,\n      tourMinimise: () => { try { sessionStorage.setItem('hcTourMin', '1'); } catch (x) {} this.setState({ tourMin: true }); },\n      tourExpand: () => { try { sessionStorage.setItem('hcTourMin', '0'); } catch (x) {} this.setState({ tourMin: false }); },\n      dots: [0, 1, 2, 3].map(i => ({ style: 'display:block;height:8px;flex:1;border-radius:4px;background:' + (i \u003c s.step ? '#1AA5B5' : i === s.step ? '#7FD6DF' : '#E2EAED') })),\n      s0: s.step === 0, s1: s.step === 1, s2: s.step === 2, s3: s.step === 3, s4: s.step === 4, showNav: s.step \u003c 4,\n      setNat: (e) => this.setState({ nat: e.target.value }), setPhase: (e) => this.setState({ phase: e.target.value }),\n      eligShown: !!(s.nat && s.phase), eligMsg: s.phase + ' schools in ' + s.nat + ' are eligible for the free unit library' + (s.nat === 'Wales' ? ', in English and Welsh.' : '.'),\n      setSchool: (e) => this.setState({ school: e.target.value }), setFirst: (e) => this.setState({ first: e.target.value }),\n      doms: DOMS.map(d => ({ t: d, pressed: s.doms[d] ? 'true' : 'false', style: chip(!!s.doms[d]), pick: () => { const n = Object.assign({}, s.doms); n[d] = !n[d]; this.setState({ doms: n }); } })),\n      setup: SETUP.map(t => { const on = !!s.setup[t]; return { t, box: on ? '☑' : '☐', pressed: on ? 'true' : 'false', pick: () => { const n = Object.assign({}, s.setup); n[t] = !on; this.setState({ setup: n }); }, style: 'display:flex;gap:10px;align-items:center;width:100%;min-height:48px;padding:12px 14px;border-radius:12px;font-size:16px;cursor:pointer;color:#1C1A4A;border:2px solid ' + (on ? '#1C1A4A;background:#F2FAFB' : '#D5DEE2;background:#FFFFFF') }; }),\n      firstName: s.first.trim() || 'there',\n      doneMsg: (s.school.trim() || 'Your school') + ' now has the heritage lesson unit library' + (picked.length ? ', starting with ' + picked.join(', ') : '') + '. Login details are on their way to your school email.',\n      back: () => this.setState({ step: Math.max(0, s.step - 1) }),\n      next: () => this.setState({ step: Math.min(4, s.step + 1) }),\n      nextLabel: s.step \u003c 3 ? 'Continue →' : 'Sign up free'\n    };\n  }\n}\n\u003c/script>\n\n\n\u003cscript src=\"../audio-heritage-crafts/manifest.js\">\u003c/script>\n\u003cscript>\n/* narration for the feature tour */\n(function(){\nvar KEYS={\"Welcome to the feature tour\": \"s01\", \"Four simple menus\": \"s02\", \"The heritage sector, together\": \"s03\", \"A route for every learner\": \"s04\", \"Craft finder\": \"s05\", \"Explore 42 crafts\": \"s06\", \"Private partner dashboards\": \"s07\", \"Continue the tour on each page\": \"s08\", \"VWE library\": \"s09\", \"A day on site\": \"s10\", \"One post, five days\": \"s11\", \"Careers planner\": \"s12\", \"How you can progress\": \"s13\", \"Colleges, courses and bursaries\": \"s14\", \"Partners and opportunities\": \"s15\", \"Linked lessons\": \"s16\", \"Teacher training\": \"s17\", \"Lesson unit library\": \"s18\", \"School sign-up\": \"s19\"}, LS='heritageNar', PRE='../';\nvar aud=new Audio(); aud.preload='auto';\nvar on=true; try{on=localStorage.getItem(LS)!=='0';}catch(e){}\nvar last=null, btn=null, cur=null, timer=0, shown='';\nfunction panel(){return document.querySelector('aside[aria-label=\"Virtual tour of features\"],aside[aria-label=\"Feature tour guide\"],aside[aria-label=\"Feature tour\"]');}\nfunction titleOf(p){var b=p.querySelector('b');return b?b.textContent.trim():'';}\nfunction fmt(d){d=Math.round(d||0);return Math.floor(d/60)+':'+('0'+d%60).slice(-2);}\nfunction clip(t){var k=KEYS[t],A=window.__NT_AUDIO||{};return k&&A[k]?A[k]:null;}\nfunction label(){if(!btn)return;var s=(on?'🔊 Narration on':'🔇 Narration off')+(cur?' · '+fmt(cur.dur):'');if(s!==shown){shown=s;btn.textContent=s;}btn.setAttribute('aria-pressed',on);}\nfunction play(){aud.pause();if(!on||!cur)return;aud.src=PRE+cur.src;aud.currentTime=0;var pr=aud.play();if(pr&&pr.catch)pr.catch(function(){});}\nfunction place(p){var r=p.getBoundingClientRect();btn.style.bottom=(window.innerHeight-r.top+8)+'px';btn.style.right=Math.max(8,window.innerWidth-r.right)+'px';}\nfunction sync(){\n  var p=panel();\n  if(!p){if(last!==null){aud.pause();last=null;cur=null;}if(btn)btn.style.display='none';return;}\n  var t=titleOf(p);\n  if(t!==last){last=t;cur=clip(t);play();}\n  if(!btn){btn=document.createElement('button');btn.type='button';btn.id='ntNar';\n    btn.style.cssText='position:fixed;z-index:9999;background:#121036;color:#fff;border:2px solid #F5C542;border-radius:999px;padding:8px 14px;font:700 13px/1 system-ui,sans-serif;cursor:pointer;min-height:36px';\n    btn.onclick=function(){on=!on;try{localStorage.setItem(LS,on?'1':'0');}catch(e){}label();if(on)play();else aud.pause();};\n    document.body.appendChild(btn);}\n  btn.style.display=cur?'':'none';label();place(p);\n}\nfunction later(){clearTimeout(timer);timer=setTimeout(sync,80);}\nnew MutationObserver(later).observe(document.body,{childList:true,subtree:true,characterData:true});\nwindow.addEventListener('hashchange',later);window.addEventListener('resize',later);\ndocument.addEventListener('DOMContentLoaded',later);later();\n})();\n\u003c/script>\n\u003c/body>\u003c/html>"
