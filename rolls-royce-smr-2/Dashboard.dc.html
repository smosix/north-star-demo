<body>
  <div id="__bundler_placeholder">Loading My dashboard · Rolls-Royce SMR careers...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ut cutting it open?\": \"Sut gallwch chi ddod o hyd i grac sydd wedi’i guddio y tu mewn i ddur trwchus heb ei dorri ar agor?\", \"KS3 forces, KS4 energy and electricity, geography of Ynys Môn and the coast\": \"Grymoedd CA3, ynni a thrydan CA4, daearyddiaeth Ynys Môn a’r arfordir\", \"Wylfa apprentices at Coleg Menai, and about 3,000 jobs at peak construction\": \"Prentisiaid Wylfa yng Ngholeg Menai, a thua 3,000 o swyddi ar anterth y gwaith adeiladu\", \"£12m manufacturing development and first training centre, opening late 2026\": \"£12m ar gyfer datblygu gweithgynhyrchu a’r ganolfan hyfforddi gyntaf, yn agor ddiwedd 2026\", \"Become a qualified technician or engineer, then a specialist or team leader.\": \"Dewch yn dechnegydd neu’n beiriannydd cymwys, yna’n arbenigwr neu’n arweinydd tîm.\", \"Find the nuclear job that fits you, see the real pay and plan your route in.\": \"Dewch o hyd i’r swydd niwclear sy’n addas i chi, gweld y cyflog go iawn a chynllunio eich llwybr i mewn.\", \"Say you haven’t had the briefing yet and ask to be inducted before you start\": \"Dweud nad ydych chi wedi cael y sesiwn friffio eto a gofyn am gyflwyniad cyn dechrau\", \"The full 5-day VWE (25 learning hours) shows all eight jobs around this one.\": \"Mae’r PGRh 5 diwrnod llawn (25 awr ddysgu) yn dangos pob un o’r wyth swydd o gwmpas yr un hon.\", \"Use your leadership experience to move into specialist or team leader roles.\": \"Defnyddiwch eich profiad o arwain i symud i swyddi arbenigol neu arweinydd tîm.\", \"KS3 atoms, KS4 radioactivity and half-life, geography of environmental impact\": \"Atomau CA3, ymbelydredd a hanner oes CA4, daearyddiaeth effaith amgylcheddol\", \"Degree apprenticeship study alongside work in Manchester, Warrington or Derby.\": \"Astudio prentisiaeth gradd ochr yn ochr â gwaith ym Manceinion, Warrington neu Derby.\", \"A key supplier says a valve will arrive three months late. What do you do first?\": \"Mae cyflenwr allweddol yn dweud y bydd falf yn cyrraedd dri mis yn hwyr. Beth ydych chi’n ei wneud gyntaf?\", \"A part must be accurate to 0.1 mm. You measure it and it is 0.3 mm too big. You…\": \"Rhaid i ran fod yn gywir i 0.1 mm. Rydych chi’n ei mesur ac mae 0.3 mm yn rhy fawr. Rydych chi’n…\", \"Click any step to see what to do and where Rolls-Royce SMR fits. Switch anytime.\": \"Cliciwch ar unrhyw gam i weld beth i’w wneud a lle mae Rolls-Royce SMR yn ffitio. Newidiwch unrhyw bryd.\", \"One controlled digital model, so everyone works from the latest approved version\": \"Un model digidol rheoledig, fel bod pawb yn gweithio o’r fersiwn ddiweddaraf a gymeradwywyd\", \"This role needs experience. Start with an apprenticeship in the same job family.\": \"Mae angen profiad ar gyfer y rôl hon. Dechreuwch gyda phrentisiaeth yn yr un teulu swyddi.\", \"Three Rolls-Royce SMRs, at least 1,400 MW, about 3,000 jobs at peak construction\": \"Tri Rolls-Royce SMR, o leiaf 1,400 MW, tua 3,000 o swyddi ar anterth y gwaith adeiladu\", \"VWE content to build with Rolls-Royce SMR teams and Developing Experts teachers.\": \"Cynnwys y PGRh i’w adeiladu gyda thimau Rolls-Royce SMR ac athrawon Developing Experts.\", \"Developing Experts × Rolls-Royce SMR · teacher dashboard prototype with demo data\": \"Developing Experts × Rolls-Royce SMR · prototeip dangosfwrdd athrawon gyda data demo\", \"KS3 maths and data, KS4 computer science, geography of Europe and energy security\": \"Mathemateg a data CA3, cyfrifiadureg CA4, daearyddiaeth Ewrop a diogeledd ynni\", \"People in Cemaes ask how the build will affect traffic. What’s the best response?\": \"Mae pobl yng Nghemaes yn gofyn sut bydd y gwaith adeiladu’n effeithio ar draffig. Beth yw’r ymateb gorau?\", \"College or training centre learning, then on the job alongside experienced people.\": \"Dysgu mewn coleg neu ganolfan hyfforddi, yna yn y gwaith ochr yn ochr â phobl brofiadol.\", \"Two teams are working from different versions of the same drawing. What’s the fix?\": \"Mae dau dîm yn gweithio o fersiynau gwahanol o’r un llun. Beth yw’r ateb?\", \"Why does building the same design many times, in the UK, Czechia and Sweden, help?\": \"Pam mae adeiladu’r un dyluniad sawl gwaith, yn y DU, Tsiecia a Sweden, yn helpu?\", \"How Rolls-Royce SMR is building a nuclear workforce, and the projects that need it.\": \"Sut mae Rolls-Royce SMR yn adeiladu gweithlu niwclear, a’r prosiectau sydd ei angen.\", \"You’ve wired a pump motor. Before it is switched on for the first time, you should…\": \"Rydych chi wedi gwifro modur pwmp. Cyn ei droi ymlaen am y tro cyntaf, dylech chi…\", \"Developing Experts lessons in science, history and geography that lead into this VWE\": \"Gwersi Developing Experts mewn gwyddoniaeth, hanes a daearyddiaeth sy’n arwain at y PGRh hwn\", \"Do the KS3 version in class, or the full 5-day VWE (25 learning hours) from Year 10.\": \"Gwnewch y fersiwn CA3 yn y dosbarth, neu’r PGRh 5 diwrnod llawn (25 awr ddysgu) o Flwyddyn 10.\", \"Photo placeholder: Apprentices in the engineering workshop at Coleg Menai, Llangefni\": \"Dalfan llun: Prentisiaid yng ngweithdy peirianneg Coleg Menai, Llangefni\", \"Your weld looks fine, but the welding record is missing one reading. What do you do?\": \"Mae eich weldiad yn edrych yn iawn, ond mae un darlleniad ar goll o’r cofnod weldio. Beth ydych chi’n ei wneud?\", \". Your results go to Rolls-Royce SMR only if you choose to share them when you apply.\": \". Dim ond os byddwch chi’n dewis eu rhannu wrth wneud cais y bydd eich canlyniadau’n mynd i Rolls-Royce SMR.\", \"KS3 materials and particles, KS4 waves (ultrasound and X-rays), design and technology\": \"Deunyddiau a gronynnau CA3, tonnau CA4 (uwchsain a phelydrau-X), dylunio a thechnoleg\", \"Modules are made in factories and moved to site. What limits how big a module can be?\": \"Mae modiwlau’n cael eu gwneud mewn ffatrïoedd a’u symud i’r safle. Beth sy’n cyfyngu ar faint modiwl?\", \"The Office for Nuclear Regulation, the Environment Agency and Natural Resources Wales\": \"Y Swyddfa Rheoleiddio Niwclear, Asiantaeth yr Amgylchedd a Cyfoeth Naturiol Cymru\", \"Around 80% of each plant is conventional, non-nuclear work, so many trades are needed.\": \"Mae tua 80% o bob gorsaf yn waith confensiynol, heb fod yn niwclear, felly mae angen llawer o grefftau.\", \"Explain the traffic plan clearly, in Welsh or English, and share how to raise concerns\": \"Esbonio’r cynllun traffig yn glir, yn Gymraeg neu yn Saesneg, a rhannu sut i godi pryderon\", \"Passive safety systems that use natural forces such as gravity and natural circulation\": \"Systemau diogelwch goddefol sy’n defnyddio grymoedd naturiol fel disgyrchiant a chylchrediad naturiol\", \"Advanced (Level 3), higher (Levels 4 and 5) and degree (Levels 6 and 7) apprenticeships\": \"Prentisiaethau uwch (Lefel 3), lefel uwch (Lefelau 4 a 5) a gradd (Lefelau 6 a 7)\", \"Apply for an apprenticeship or a trainee role with Rolls-Royce SMR or its supply chain.\": \"Gwnewch gais am brentisiaeth neu rôl hyfforddai gyda Rolls-Royce SMR neu ei gadwyn gyflenwi.\", \"Complete two or three VWEs in your target family. Your results become your application.\": \"Cwblhewch ddau neu dri PGRh yn y teulu rydych chi’n anelu ato. Eich canlyniadau fydd eich cais.\", \"In a pressurised water reactor, why is the water around the core kept at high pressure?\": \"Mewn adweithydd dŵr dan wasgedd, pam mae’r dŵr o gwmpas y craidd yn cael ei gadw dan wasgedd uchel?\", \"School leavers and career changers welcome, with no upper age limit for apprenticeships\": \"Croeso i bobl sy’n gadael yr ysgol a phobl sy’n newid gyrfa, heb uchafswm oed ar gyfer prentisiaethau\", \"A nuclear careers map for careers leaders, built on Rolls-Royce SMR’s real roles and pay\": \"Map gyrfaoedd niwclear i arweinwyr gyrfaoedd, wedi’i seilio ar swyddi a chyflog go iawn Rolls-Royce SMR\", \"Isolate it, test the insulation and connections, and get the work checked and signed off\": \"Ei ynysu, profi’r inswleiddio a’r cysylltiadau, a chael rhywun i wirio a chymeradwyo’r gwaith\", \"Photos to source from Rolls-Royce SMR’s media library, with consent from everyone shown.\": \"Lluniau i’w cael o lyfrgell gyfryngau Rolls-Royce SMR, gyda chaniatâd pawb sydd ynddyn nhw.\", \"Finish VWEs in your favourite job family. Your scores build a profile that replaces a CV.\": \"Gorffennwch PGRh yn eich hoff deulu swyddi. Mae eich sgoriau’n adeiladu proffil sy’n cymryd lle CV.\", \"in science, history and geography, from the Industrial Revolution to GCSE atomic structure\": \"mewn gwyddoniaeth, hanes a daearyddiaeth, o’r Chwyldro Diwydiannol i adeiledd atomig TGAU\", \"Five VWEs and 40 thirty-minute career spotlights. Your results replace a CV when you apply.\": \"Pum PGRh a 40 sbotolau gyrfa 30 munud. Mae eich canlyniadau’n cymryd lle CV pan fyddwch yn gwneud cais.\", \"Graduate programmes fill early. Register interest and keep your results profile up to date.\": \"Mae rhaglenni graddedigion yn llenwi’n gynnar. Cofrestrwch eich diddordeb a chadwch broffil eich canlyniadau’n gyfredol.\", \"Prototype: nothing is sent. At launch this creates the school’s Developing Experts account.\": \"Prototeip: does dim yn cael ei anfon. Yn y lansiad, bydd hwn yn creu cyfrif Developing Experts yr ysgol.\", \"Apprenticeships for September 2026 have closed. Watch for the next round [dates to confirm].\": \"Mae prentisiaethau mis Medi 2026 wedi cau. Cadwch lygad am y rownd nesaf [dyddiadau i’w cadarnhau].\", \"Around 10 Safety and Regulatory Affairs apprentices based on Ynys Môn, recruited from May 2026\": \"Tua 10 prentis Diogelwch a Materion Rheoleiddio ar Ynys Môn, wedi’u recriwtio o fis Mai 2026\", \"Factories control quality and repeat the same steps, so builds are faster and more predictable\": \"Mae ffatrïoedd yn rheoli ansawdd ac yn ailadrodd yr un camau, felly mae’r gwaith adeiladu’n gyflymach ac yn fwy rhagweladwy\", \"Match your degree to the work: reactor design, safety cases, manufacturing or the Wylfa build.\": \"Paru eich gradd â’r gwaith: dylunio’r adweithydd, achosion diogelwch, gweithgynhyrchu neu adeiladu Wylfa.\", \"Take the career finder. It takes two minutes and uses your interests, not your qualifications.\": \"Defnyddiwch yr offeryn canfod gyrfa. Mae’n cymryd dau funud ac yn defnyddio eich diddordebau, nid eich cymwysterau.\", \"The plant must remove heat from the core even if electrical power is lost. A good approach is…\": \"Rhaid i’r gwaith dynnu gwres o’r craidd hyd yn oed os bydd y pŵer trydan yn methu. Dull da yw…\", \"Finish a simulation and your best-fit jobs at Rolls-Royce SMR and its supply chain appear here.\": \"Gorffennwch efelychiad a bydd y swyddi sy’n gweddu orau i chi yn Rolls-Royce SMR a’i gadwyn gyflenwi yn ymddangos yma.\", \"Apply for the Safety and Regulatory Affairs Graduate Programme or entry-level engineering roles.\": \"Gwnewch gais am y Rhaglen Raddedigion Diogelwch a Materion Rheoleiddio neu swyddi peirianneg lefel mynediad.\", \"Coleg Menai in Llangefni, then on the job near Wylfa [construction training partners to confirm]\": \"Coleg Menai yn Llangefni, yna yn y gwaith ger Wylfa [partneriaid hyfforddi adeiladu i’w cadarnhau]\", \"Every apprentice and graduate can work towards Nuclear Institute membership and chartered status\": \"Gall pob prentis a graddedig weithio tuag at aelodaeth o’r Sefydliad Niwclear a statws siartredig\", \"Free VWEs, linked lessons and teacher training, with Gatsby and Careers Wales evidence built in.\": \"PGRh am ddim, gwersi cysylltiedig a hyfforddiant i athrawon, gyda thystiolaeth Gatsby a Gyrfa Cymru wedi’i chynnwys.\", \"Maths and science GCSEs, then A levels or a T Level in maths, science, engineering or computing.\": \"TGAU mathemateg a gwyddoniaeth, yna Safon Uwch neu Lefel T mewn mathemateg, gwyddoniaeth, peirianneg neu gyfrifiadureg.\", \"Rolls-Royce SMR has projects under contract in the UK and Czechia, and has been chosen in Sweden.\": \"Mae gan Rolls-Royce SMR brosiectau dan gontract yn y DU a Tsiecia, ac mae wedi cael ei ddewis yn Sweden.\", \"Schools near Rolls-Royce SMR sites: sponsored lesson unit library [to agree with Rolls-Royce SMR]\": \"Ysgolion ger safleoedd Rolls-Royce SMR: llyfrgell unedau gwersi wedi’i noddi [i’w chytuno â Rolls-Royce SMR]\", \"Developing Experts × Rolls-Royce SMR · staff area prototype · learner data shown only in aggregate\": \"Developing Experts × Rolls-Royce SMR · prototeip ardal staff · data dysgwyr yn cael ei ddangos ar y cyd yn unig\", \"Pick any of the 40 jobs. We map the steps from where you are now, and where the job can lead after.\": \"Dewiswch unrhyw un o’r 40 swydd. Rydyn ni’n mapio’r camau o ble rydych chi nawr, a ble gall y swydd arwain wedyn.\", \"At launch this exports a PDF and spreadsheet for skills, social value and Wylfa community reporting.\": \"Yn y lansiad, bydd hwn yn allforio PDF a thaenlen ar gyfer adrodd ar sgiliau, gwerth cymdeithasol a chymuned Wylfa.\", \"Every Rolls-Royce SMR apprentice can work towards Nuclear Institute membership and chartered status.\": \"Gall pob prentis Rolls-Royce SMR weithio tuag at aelodaeth o’r Sefydliad Niwclear a statws siartredig.\", \"Maths and science keep most engineering doors open. Engineering, computing or design GCSEs help too.\": \"Mae mathemateg a gwyddoniaeth yn cadw’r rhan fwyaf o ddrysau peirianneg ar agor. Mae TGAU peirianneg, cyfrifiadureg neu ddylunio’n helpu hefyd.\", \"On the job in Derby, Manchester or Warrington, with an apprenticeship training provider [to confirm]\": \"Yn y gwaith yn Derby, Manceinion neu Warrington, gyda darparwr hyfforddiant prentisiaethau [i’w gadarnhau]\", \"Pioneer Works in Derby, Rolls-Royce SMR’s first training centre, and EXPERI at the AMRC in Sheffield\": \"Pioneer Works yn Derby, canolfan hyfforddi gyntaf Rolls-Royce SMR, ac EXPERI yn yr AMRC yn Sheffield\", \"Don’t share your full name, address or contact details. Chats aren’t saved after you leave this page.\": \"Peidiwch â rhannu eich enw llawn, eich cyfeiriad na’ch manylion cyswllt. Dydy sgyrsiau ddim yn cael eu cadw ar ôl i chi adael y dudalen hon.\", \"Graduates choose from four safety specialisms, including hazards and probabilistic safety assessment.\": \"Mae graddedigion yn dewis o blith pedwar maes diogelwch arbenigol, gan gynnwys peryglon ac asesu diogelwch tebygolrwyddol.\", \"KS3 atoms and energy, KS4 atomic structure, radioactivity and generating electricity, A level physics\": \"Atomau ac ynni CA3, adeiledd atomig, ymbelydredd a chynhyrchu trydan CA4, ffiseg Safon Uwch\", \"Nothing yet. Tell us who you are on the home page, or try a VWE, and the coach can tailor its advice.\": \"Dim byd eto. Dywedwch wrthon ni pwy ydych chi ar yr hafan, neu rhowch gynnig ar PGRh, a gall yr hyfforddwr deilwra ei gyngor.\", \"Rolls-Royce SMR’s module development facility inside the University of Sheffield AMRC’s Factory 2050.\": \"Cyfleuster datblygu modiwlau Rolls-Royce SMR yn Factory 2050 AMRC Prifysgol Sheffield.\", \"You spot a small mistake in a calculation that has already gone to the regulator. What should happen?\": \"Rydych chi’n sylwi ar gamgymeriad bach mewn cyfrifiad sydd eisoes wedi mynd at y rheoleiddiwr. Beth ddylai ddigwydd?\", \"Inclusion networks including BETA for early careers and REACH for racial, ethnic and cultural heritage\": \"Rhwydweithiau cynhwysiant gan gynnwys BETA ar gyfer gyrfaoedd cynnar a REACH ar gyfer treftadaeth hiliol, ethnig a diwylliannol\", \"Free virtual work experience for every job family, in Welsh and English, with lessons that lead into it\": \"Profiad gwaith rhithwir am ddim ar gyfer pob teulu swyddi, yn Gymraeg ac yn Saesneg, gyda gwersi sy’n arwain ato\", \"Demo data for illustration only. At launch every figure comes live from the Developing Experts platform.\": \"Data demo i ddangos yn unig. Yn y lansiad, bydd pob ffigur yn dod yn fyw o blatfform Developing Experts.\", \"Every VWE is built around real Rolls-Royce SMR jobs, from welders in Derby to safety experts on Ynys Môn.\": \"Mae pob PGRh wedi’i adeiladu o gwmpas swyddi go iawn Rolls-Royce SMR, o weldwyr yn Derby i arbenigwyr diogelwch ar Ynys Môn.\", \"Apply for Level 3, higher or degree apprenticeships in engineering, safety, project management or digital.\": \"Gwnewch gais am brentisiaethau Lefel 3, lefel uwch neu radd mewn peirianneg, diogelwch, rheoli prosiectau neu ddigidol.\", \"Prototype: at launch this hands off to Rolls-Royce SMR’s own sign-in. No password is entered on this site.\": \"Prototeip: yn y lansiad, bydd hwn yn trosglwyddo i system fewngofnodi Rolls-Royce SMR. Does dim cyfrinair yn cael ei roi ar y wefan hon.\", \"The coach isn’t available in this view. Open the page in Claude to chat, or use the career finder instead.\": \"Dydy’r hyfforddwr ddim ar gael yn yr olwg hon. Agorwch y dudalen yn Claude i sgwrsio, neu defnyddiwch yr offeryn canfod gyrfa yn lle hynny.\", \"Explore the map, compare roles across six job families, then plan your money with the lifestyle calculator.\": \"Archwiliwch y map, cymharwch swyddi ar draws chwe theulu swyddi, yna cynlluniwch eich arian gyda’r gyfrifiannell ffordd o fyw.\", \"Prototype: the application continues on the employer’s own site. Supply-chain vacancy feeds are to connect.\": \"Prototeip: mae’r cais yn parhau ar wefan y cyflogwr. Mae ffrydiau swyddi gwag y gadwyn gyflenwi i’w cysylltu.\", \"Apply for a Level 3 apprenticeship, or take a T Level, BTEC, A levels or the Welsh Baccalaureate at college.\": \"Gwnewch gais am brentisiaeth Lefel 3, neu astudiwch Lefel T, BTEC, Safon Uwch neu Fagloriaeth Cymru yn y coleg.\", \"On the job in Derby, Manchester or Warrington, with a university partner for degree apprentices [to confirm]\": \"Yn y gwaith yn Derby, Manceinion neu Warrington, gyda phartner prifysgol ar gyfer prentisiaid gradd [i’w gadarnhau]\", \"A strengths-based approach: people are hired for what makes them great [workforce diversity goals to confirm]\": \"Dull sy’n seiliedig ar gryfderau: mae pobl yn cael eu cyflogi am yr hyn sy’n eu gwneud yn wych [nodau amrywiaeth y gweithlu i’w cadarnhau]\", \"Rolls-Royce SMR’s £12m manufacturing development centre, due to open in late 2026 as its first training centre.\": \"Canolfan datblygu gweithgynhyrchu £12m Rolls-Royce SMR, sydd i fod i agor ddiwedd 2026 fel ei chanolfan hyfforddi gyntaf.\", \"A heavy factory-built module arrives by sea, and strong winds are forecast this afternoon. What’s the best plan?\": \"Mae modiwl trwm o’r ffatri’n cyrraedd ar y môr, ac mae gwyntoedd cryfion yn cael eu darogan y prynhawn yma. Beth yw’r cynllun gorau?\", \"Demo class with made-up pupils. In the live version, pupils sign in with school accounts and only you see names.\": \"Dosbarth demo gyda disgyblion ffug. Yn y fersiwn fyw, mae disgyblion yn mewngofnodi gyda chyfrifon ysgol a dim ond chi sy’n gweld enwau.\", \"Need to teach the science first? Each VWE links to Developing Experts lessons in science, history and geography.\": \"Angen addysgu’r wyddoniaeth yn gyntaf? Mae pob PGRh yn cysylltu â gwersi Developing Experts mewn gwyddoniaeth, hanes a daearyddiaeth.\", \"Take the career finder and try two virtual work experiences. Talk to your careers leader about what you enjoyed.\": \"Defnyddiwch yr offeryn canfod gyrfa a rhowch gynnig ar ddau brofiad gwaith rhithwir. Siaradwch â’ch arweinydd gyrfaoedd am beth wnaethoch chi ei fwynhau.\", \"Each VWE comes as a KS3 lesson with careers links, plus teacher training, so pupils meet real nuclear jobs early.\": \"Mae pob PGRh ar gael fel gwers CA3 gyda chysylltiadau gyrfaoedd, a hyfforddiant i athrawon, fel bod disgyblion yn cwrdd â swyddi niwclear go iawn yn gynnar.\", \"Gatsby Benchmarks 2, 4, 5 and 6 in England, and Careers and Work-Related Experiences in Wales, logged per school.\": \"Meincnodau Gatsby 2, 4, 5 a 6 yn Lloegr, a Gyrfaoedd a Phrofiadau sy’n Gysylltiedig â Gwaith yng Nghymru, wedi’u cofnodi ar gyfer pob ysgol.\", \"A temperature sensor in the digital twin suddenly jumps to 900°C, then back to normal a second later. Most likely?\": \"Mae synhwyrydd tymheredd yn yr efaill digidol yn neidio’n sydyn i 900°C, yna’n ôl i’r arfer eiliad yn ddiweddarach. Beth sydd fwyaf tebygol?\", \"Nuclear apprenticeships usually ask for maths, English and science [entry grades to confirm with Rolls-Royce SMR].\": \"Fel arfer, mae prentisiaethau niwclear yn gofyn am fathemateg, Saesneg a gwyddoniaeth [graddau mynediad i’w cadarnhau gyda Rolls-Royce SMR].\", \"Click a pin or a place name to see the jobs and training in that area. Filter by project sites, training or offices.\": \"Cliciwch ar bin neu enw lle i weld y swyddi a’r hyfforddiant yn yr ardal honno. Hidlwch yn ôl safleoedd prosiect, hyfforddiant neu swyddfeydd.\", \"Engineering, electrical, science, IT or business courses all help. Ask your tutor how your course maps to this role.\": \"Mae cyrsiau peirianneg, trydanol, gwyddoniaeth, TG neu fusnes i gyd yn helpu. Gofynnwch i’ch tiwtor sut mae eich cwrs yn cyd-fynd â’r rôl hon.\", \"Use data, digital models and good planning to deliver a fleet of reactors in three countries, on time and on budget.\": \"Defnyddio data, modelau digidol a chynllunio da i ddarparu fflyd o adweithyddion mewn tair gwlad, ar amser ac o fewn y gyllideb.\", \"Coleg Menai in Llangefni for the Level 3 apprenticeship, or the graduate programme in Derby, Manchester or Warrington\": \"Coleg Menai yn Llangefni ar gyfer y brentisiaeth Lefel 3, neu’r rhaglen raddedigion yn Derby, Manceinion neu Warrington\", \"Developing Experts × Rolls-Royce SMR · VWE content and supply-chain roles are proposals to build with Rolls-Royce SMR\": \"Developing Experts × Rolls-Royce SMR · mae cynnwys y PGRh a swyddi’r gadwyn gyflenwi’n gynigion i’w hadeiladu gyda Rolls-Royce SMR\", \"Encounters, experience hours and Welsh-language use reported for Wylfa local skills commitments [to agree with GBE-N].\": \"Cyfarfodydd, oriau profiad a defnydd o’r Gymraeg wedi’u hadrodd ar gyfer ymrwymiadau sgiliau lleol Wylfa [i’w cytuno â GBE-N].\", \"Engineer pay from Rolls-Royce SMR adverts, 2025. Progression steps are typical routes to confirm with Rolls-Royce SMR.\": \"Cyflog peirianwyr o hysbysebion Rolls-Royce SMR, 2025. Mae’r camau dilyniant yn llwybrau nodweddiadol i’w cadarnhau gyda Rolls-Royce SMR.\", \"Only learners who chose to share their results appear here. Names stay hidden until a candidate accepts an invitation.\": \"Dim ond dysgwyr a ddewisodd rannu eu canlyniadau sy’n ymddangos yma. Mae enwau’n aros yn gudd nes bydd ymgeisydd yn derbyn gwahoddiad.\", \"VWEs are free for everyone. Sign up your school to add sequenced lessons that lead into each VWE, plus class tracking.\": \"Mae’r PGRh am ddim i bawb. Cofrestrwch eich ysgol i ychwanegu gwersi mewn trefn sy’n arwain at bob PGRh, a thracio dosbarthiadau.\", \"Use VWEs as evidence in your applications, match your course to Rolls-Royce SMR roles and apply when recruitment opens.\": \"Defnyddiwch y PGRh fel tystiolaeth yn eich ceisiadau, paru eich cwrs â swyddi Rolls-Royce SMR a gwneud cais pan fydd recriwtio’n agor.\", \"Concept draft for discussion with Rolls-Royce SMR · facts from Rolls-Royce SMR’s published news and adverts, 2025 to 2026\": \"Drafft cysyniad i’w drafod gyda Rolls-Royce SMR · ffeithiau o newyddion a hysbysebion cyhoeddedig Rolls-Royce SMR, 2025 i 2026\", \"Open any VWE or spotlight above and play the simulation. Your choices are scored, and the jobs that suit you appear here.\": \"Agorwch unrhyw PGRh neu sbotolau uchod a chwaraewch yr efelychiad. Mae eich dewisiadau’n cael sgôr, ac mae’r swyddi sy’n eich siwtio’n ymddangos yma.\", \"Build the digital twin of the plant, the control systems that run it and the data that keeps a fleet of reactors on track.\": \"Adeiladu efaill digidol y gwaith, y systemau rheoli sy’n ei redeg a’r data sy’n cadw fflyd o adweithyddion ar y trywydd iawn.\", \"Candidates are judged on what they did in real tasks, not on CV polish, which opens doors for people without work history.\": \"Mae ymgeiswyr yn cael eu barnu ar beth wnaethon nhw mewn tasgau go iawn, nid ar CV graenus, sy’n agor drysau i bobl heb hanes gwaith.\", \"Concept draft for discussion with Rolls-Royce SMR · figures as published by Rolls-Royce SMR and news sources, 2025 to 2026\": \"Drafft cysyniad i’w drafod gyda Rolls-Royce SMR · ffigurau fel y’u cyhoeddwyd gan Rolls-Royce SMR a ffynonellau newyddion, 2025 i 2026\", \"Priority areas: Ynys Môn and Gwynedd, North East Wales, Derby and Derbyshire, Greater Manchester, Warrington and Sheffield\": \"Ardaloedd blaenoriaeth: Ynys Môn a Gwynedd, Gogledd Ddwyrain Cymru, Derby a Swydd Derby, Manceinion Fwyaf, Warrington a Sheffield\", \"Engineering, operations, safety, logistics and leadership skills from service transfer straight into Rolls-Royce SMR roles.\": \"Mae sgiliau peirianneg, gweithrediadau, diogelwch, logisteg ac arwain o’r lluoedd yn trosglwyddo’n syth i swyddi Rolls-Royce SMR.\", \"Everything you’ve done across the site, in one place: your pathway, simulation scores, badges, saved VWEs and applications.\": \"Popeth rydych chi wedi’i wneud ar draws y wefan, mewn un lle: eich llwybr, sgoriau efelychiadau, bathodynnau, PGRh wedi’u cadw a cheisiadau.\", \"Maths, English and science keep this route open. Engineering, computing or design GCSEs help too. [Entry grades to confirm]\": \"Mae mathemateg, Saesneg a gwyddoniaeth yn cadw’r llwybr hwn ar agor. Mae TGAU peirianneg, cyfrifiadureg neu ddylunio’n helpu hefyd. [Graddau mynediad i’w cadarnhau]\", \"Yes. Every virtual work experience and the careers tools on Developing Experts are free for learners, schools and colleges.\": \"Ydy. Mae pob profiad gwaith rhithwir a’r offer gyrfaoedd ar Developing Experts am ddim i ddysgwyr, ysgolion a cholegau.\", \"[A short story from a veteran now at Rolls-Royce SMR: the service role, how nuclear skills transferred, and the job today.]\": \"[Stori fer gan gyn-filwr sydd bellach yn Rolls-Royce SMR: y rôl yn y lluoedd, sut trosglwyddodd sgiliau niwclear, a’r swydd heddiw.]\", \"It’s your first morning on site. A supervisor asks you to start work in an area you haven’t been briefed on. What do you do?\": \"Mae’n fore cyntaf i chi ar y safle. Mae goruchwyliwr yn gofyn i chi ddechrau gweithio mewn ardal nad ydych chi wedi cael sesiwn friffio amdani. Beth ydych chi’n ei wneud?\", \"Your evidence report is saved to your Developing Experts dashboard. It is shared with Rolls-Royce SMR only if you choose to.\": \"Mae eich adroddiad tystiolaeth wedi’i gadw yn eich dangosfwrdd Developing Experts. Dim ond os byddwch chi’n dewis gwneud hynny y caiff ei rannu â Rolls-Royce SMR.\", \"Learn how engineers prove a nuclear plant is safe, secure and protects the environment, and how regulators check every claim.\": \"Dysgwch sut mae peirianwyr yn profi bod gwaith niwclear yn ddiogel, yn saff ac yn diogelu’r amgylchedd, a sut mae rheoleiddwyr yn gwirio pob honiad.\", \"Your scores in each task show where your strengths are. We match them to the 40 jobs at Rolls-Royce SMR and its supply chain.\": \"Mae eich sgoriau ym mhob tasg yn dangos ble mae eich cryfderau. Rydyn ni’n eu paru â’r 40 swydd yn Rolls-Royce SMR a’i gadwyn gyflenwi.\", \"You can start an apprenticeship at 16. Use the next few years to find what you enjoy and build the evidence employers look for.\": \"Gallwch ddechrau prentisiaeth yn 16 oed. Defnyddiwch yr ychydig flynyddoedd nesaf i ddarganfod beth rydych chi’n ei fwynhau a chasglu’r dystiolaeth mae cyflogwyr yn chwilio amdani.\", \"Prove the plant is safe, secure and protects the environment, and work with the regulators who check every detail of the design.\": \"Profi bod y gwaith yn ddiogel, yn saff ac yn diogelu’r amgylchedd, a gweithio gyda’r rheoleiddwyr sy’n gwirio pob manylyn o’r dyluniad.\", \"A degree in a related subject, or a degree apprenticeship that pays you while you study [routes to confirm with Rolls-Royce SMR].\": \"Gradd mewn pwnc perthnasol, neu brentisiaeth gradd sy’n talu i chi wrth astudio [llwybrau i’w cadarnhau gyda Rolls-Royce SMR].\", \"College training plus learning on the job. Wylfa apprentices study a Level 3 engineering qualification at Coleg Menai, Llangefni.\": \"Hyfforddiant coleg a dysgu yn y gwaith. Mae prentisiaid Wylfa’n astudio cymhwyster peirianneg Lefel 3 yng Ngholeg Menai, Llangefni.\", \"Pick a nuclear job, where you’d live and how. See your take-home pay, what’s left each month, and how fast you could reach a goal.\": \"Dewiswch swydd niwclear, ble byddech chi’n byw a sut. Gweld eich cyflog net, beth sydd ar ôl bob mis, a pha mor gyflym gallech chi gyrraedd nod.\", \"Apply with your results profile. Support for veterans, reservists, spouses and partners [Armed Forces Covenant details to confirm].\": \"Gwnewch gais gyda phroffil eich canlyniadau. Cymorth i gyn-filwyr, milwyr wrth gefn, priod a phartneriaid [manylion Cyfamod y Lluoedd Arfog i’w cadarnhau].\", \"I agree to Developing Experts contacting me about this programme. Pupil data stays with the school and is only shared in aggregate.\": \"Rwy’n cytuno i Developing Experts gysylltu â fi am y rhaglen hon. Mae data disgyblion yn aros gyda’r ysgol a dim ond ar y cyd y caiff ei rannu.\", \"Trainee roles may need you to be 18 [to confirm]. Meanwhile, a college course or apprenticeship in the same area keeps you on track.\": \"Efallai y bydd angen i chi fod yn 18 oed ar gyfer rolau hyfforddai [i’w gadarnhau]. Yn y cyfamser, mae cwrs coleg neu brentisiaeth yn yr un maes yn eich cadw ar y trywydd iawn.\", \"your step-by-step pathway, the virtual work experiences that suit you, which jobs are open to you now, and the next actions to take.\": \"eich llwybr cam wrth gam, y profiadau gwaith rhithwir sy’n eich siwtio, pa swyddi sydd ar agor i chi nawr, a’r camau nesaf i’w cymryd.\", \"Every job showcased in the five VWEs as its own short spotlight. Try a job, see the pay, and apply with your results instead of a CV.\": \"Pob swydd sy’n cael sylw yn y pum PGRh fel ei sbotolau byr ei hun. Rhowch gynnig ar swydd, gweld y cyflog, a gwneud cais gyda’ch canlyniadau yn lle CV.\", \"Home of the Nuclear Futures Institute, with nuclear research and PhD training in partnership with the UK National Nuclear Laboratory.\": \"Cartref y Sefydliad Dyfodol Niwclear, gydag ymchwil niwclear a hyfforddiant PhD mewn partneriaeth â Labordy Niwclear Cenedlaethol y DU.\", \"Plan the programme, buy from hundreds of suppliers, train the workforce and tell the story of Britain’s first small modular reactors.\": \"Cynllunio’r rhaglen, prynu gan gannoedd o gyflenwyr, hyfforddi’r gweithlu ac adrodd stori adweithyddion modiwlar bach cyntaf Prydain.\", \"Try real Rolls-Royce SMR jobs in class or at home, see which subjects lead where, and be ready to apply for an apprenticeship from 16.\": \"Rhowch gynnig ar swyddi go iawn Rolls-Royce SMR yn y dosbarth neu gartref, gweld pa bynciau sy’n arwain i ble, a byddwch yn barod i wneud cais am brentisiaeth o 16 oed.\", \"Answer four quick questions. We match you to the nuclear job families that suit you, then you can try one in a virtual work experience.\": \"Atebwch bedwar cwestiwn cyflym. Byddwn ni’n eich paru â’r teuluoedd swyddi niwclear sy’n eich siwtio, yna gallwch roi cynnig ar un mewn profiad gwaith rhithwir.\", \"Rolls-Royce SMR also works in Czechia (Temelín, office in Prague) and Sweden (Värö, next to Ringhals). Map: Natural Earth via world-atlas.\": \"Mae Rolls-Royce SMR hefyd yn gweithio yn Tsiecia (Temelín, swyddfa ym Mhrâg) a Sweden (Värö, ger Ringhals). Map: Natural Earth drwy world-atlas.\", \"The full virtual work experience: one real project over five days of about 5 hours each, 25 learning hours in total, showcasing eight jobs.\": \"Y profiad gwaith rhithwir llawn: un prosiect go iawn dros bum diwrnod o tua 5 awr yr un, 25 awr ddysgu i gyd, yn rhoi sylw i wyth swydd.\", \"See how about 90% of a power station can be built in factories: weld, assemble, inspect and test the modules that make up a Rolls-Royce SMR.\": \"Dewch i weld sut gellir adeiladu tua 90% o orsaf bŵer mewn ffatrïoedd: weldio, cydosod, archwilio a phrofi’r modiwlau sy’n creu Rolls-Royce SMR.\", \"This role usually needs a degree. A degree apprenticeship, or a related apprenticeship in the same family, can get you there while you earn.\": \"Fel arfer, mae angen gradd ar gyfer y rôl hon. Gall prentisiaeth gradd, neu brentisiaeth berthnasol yn yr un teulu, eich cael chi yno wrth ennill cyflog.\", \"Apprenticeships are open at any age, and Wylfa will need thousands of construction and trades workers. Your experience from other jobs counts.\": \"Mae prentisiaethau ar agor i bobl o unrhyw oed, a bydd angen miloedd o weithwyr adeiladu a chrefftau ar Wylfa. Mae eich profiad o swyddi eraill yn cyfrif.\", \"Find out how a pressurised water reactor turns heat from splitting atoms into electricity, and help design one that can be built in factories.\": \"Dewch i ddeall sut mae adweithydd dŵr dan wasgedd yn troi gwres o hollti atomau yn drydan, a helpwch i ddylunio un y gellir ei adeiladu mewn ffatrïoedd.\", \"A pump fails once in every 1,000 demands. A second, independent pump is just as reliable. Roughly how often would both fail on the same demand?\": \"Mae pwmp yn methu unwaith ym mhob 1,000 galwad. Mae ail bwmp annibynnol yr un mor ddibynadwy. Pa mor aml, yn fras, byddai’r ddau’n methu ar yr un alwad?\", \"You don’t need a degree. Many routes train you from scratch while you earn, and skills from oil and gas, construction or factories transfer well.\": \"Does dim angen gradd arnoch chi. Mae llawer o lwybrau’n eich hyfforddi o’r dechrau wrth i chi ennill cyflog, ac mae sgiliau o olew a nwy, adeiladu neu ffatrïoedd yn trosglwyddo’n dda.\", \"Help build the UK’s first small modular reactors on Anglesey: plan the site, put modules together under the canopy and get ready to run the plant.\": \"Helpwch i adeiladu adweithyddion modiwlar bach cyntaf y DU ar Ynys Môn: cynllunio’r safle, rhoi modiwlau at ei gilydd o dan y canopi a pharatoi i redeg y gwaith.\", \"From welder to reactor designer: pick a job family to see what each role does, how to get in, and the virtual work experience that lets you try it.\": \"O weldiwr i ddylunydd adweithyddion: dewiswch deulu swyddi i weld beth mae pob rôl yn ei wneud, sut i gael mynediad, a’r profiad gwaith rhithwir sy’n gadael i chi roi cynnig arni.\", \"The coach is an AI and can get things wrong. Check pay, dates and entry requirements with Rolls-Royce SMR or your careers leader before you decide.\": \"AI yw’r hyfforddwr a gall wneud camgymeriadau. Gwiriwch gyflog, dyddiadau a gofynion mynediad gyda Rolls-Royce SMR neu eich arweinydd gyrfaoedd cyn penderfynu.\", \"Engineer pay from Rolls-Royce SMR adverts, 2025. Apprentice pay shown is the legal minimum from April 2026; Rolls-Royce SMR’s own rates [to confirm].\": \"Cyflog peirianwyr o hysbysebion Rolls-Royce SMR, 2025. Y cyflog prentis a ddangosir yw’r isafswm cyfreithiol o fis Ebrill 2026; cyfraddau Rolls-Royce SMR ei hun [i’w cadarnhau].\", \"[A story from one of the first Anglesey-based apprentices: growing up near Wylfa, studying at Coleg Menai, and learning from nuclear safety experts.]\": \"[Stori gan un o’r prentisiaid cyntaf ar Ynys Môn: tyfu i fyny ger Wylfa, astudio yng Ngholeg Menai, a dysgu gan arbenigwyr diogelwch niwclear.]\", \"Design a 470 MW pressurised water reactor that can power about a million homes for at least 60 years. Physics, maths and engineering at the cutting edge.\": \"Dylunio adweithydd dŵr dan wasgedd 470 MW a all bweru tua miliwn o gartrefi am o leiaf 60 mlynedd. Ffiseg, mathemateg a pheirianneg ar flaen y gad.\", \"Rolls-Royce SMR recruits graduates from engineering, physics, maths, systems, risk and other STEM degrees, with teams in Derby, Manchester and Warrington.\": \"Mae Rolls-Royce SMR yn recriwtio graddedigion peirianneg, ffiseg, mathemateg, systemau, risg a graddau STEM eraill, gyda thimau yn Derby, Manceinion a Warrington.\", \"The primary training hub for Rolls-Royce SMR’s first Anglesey-based apprentices, working with Great British Energy – Nuclear to train people from North Wales.\": \"Y brif ganolfan hyfforddi ar gyfer prentisiaid cyntaf Rolls-Royce SMR ar Ynys Môn, yn gweithio gyda Great British Energy – Nuclear i hyfforddi pobl o Ogledd Cymru.\", \"Wylfa is due to supply power by the mid-2030s. Operator training will start before then; a related apprenticeship now keeps you on track [details to confirm].\": \"Mae disgwyl i Wylfa gyflenwi pŵer erbyn canol y 2030au. Bydd hyfforddiant gweithredwyr yn dechrau cyn hynny; mae prentisiaeth berthnasol nawr yn eich cadw ar y trywydd iawn [manylion i’w cadarnhau].\", \"This dashboard shows reach, engagement and applicant data for Rolls-Royce SMR’s partnership with Developing Experts. It is private to Rolls-Royce SMR colleagues.\": \"Mae’r dangosfwrdd hwn yn dangos data cyrhaeddiad, ymgysylltu ac ymgeiswyr ar gyfer partneriaeth Rolls-Royce SMR â Developing Experts. Mae’n breifat i gydweithwyr Rolls-Royce SMR.\", \"About 90% of a Rolls-Royce SMR is made in factories as modules, then put together on site. Weld, assemble, inspect and test the parts at the heart of the reactor.\": \"Mae tua 90% o Rolls-Royce SMR yn cael ei wneud mewn ffatrïoedd fel modiwlau, yna’n cael ei roi at ei gilydd ar y safle. Weldio, cydosod, archwilio a phrofi’r rhannau wrth galon yr adweithydd.\", \"Locations from Rolls-Royce SMR’s published news and adverts, 2025 to 2026. Live vacancy feeds from Rolls-Royce SMR and supply-chain partners to connect at launch.\": \"Lleoliadau o newyddion a hysbysebion cyhoeddedig Rolls-Royce SMR, 2025 i 2026. Ffrydiau swyddi gwag byw gan Rolls-Royce SMR a phartneriaid y gadwyn gyflenwi i’w cysylltu yn y lansiad.\", \"Graduate programmes in safety and regulation, plus roles in design, physics, digital engineering and project delivery. Try the work first, then apply with evidence.\": \"Rhaglenni graddedigion ym maes diogelwch a rheoleiddio, a swyddi mewn dylunio, ffiseg, peirianneg ddigidol a chyflawni prosiectau. Rhowch gynnig ar y gwaith yn gyntaf, yna gwneud cais gyda thystiolaeth.\", \"No. Your VWE and spotlight results are your application. Employers see how you tackled real tasks, not how good your CV looks, and only if you choose to share them.\": \"Nac oes. Canlyniadau eich PGRh a’ch sbotoleuadau yw eich cais. Mae cyflogwyr yn gweld sut gwnaethoch chi dasgau go iawn, nid pa mor dda mae eich CV yn edrych, a dim ond os byddwch chi’n dewis eu rhannu.\", \"Engineering, electrical, science, IT and business courses all lead into nuclear roles. Apprenticeships for each September usually open months before, so start early.\": \"Mae cyrsiau peirianneg, trydanol, gwyddoniaeth, TG a busnes i gyd yn arwain at swyddi niwclear. Mae prentisiaethau ar gyfer pob mis Medi fel arfer yn agor fisoedd ymlaen llaw, felly dechreuwch yn gynnar.\", \"Rolls-Royce SMR’s training centres, the college its first Wylfa apprentices attend, and universities and colleges near its sites. Pick your area or the route you want.\": \"Canolfannau hyfforddi Rolls-Royce SMR, y coleg mae prentisiaid cyntaf Wylfa’n ei fynychu, a phrifysgolion a cholegau ger ei safleoedd. Dewiswch eich ardal neu’r llwybr rydych chi eisiau.\", \"Hello! I’m your AI career coach. Tell me what you enjoy, or ask me anything about jobs, training and apprenticeships at Rolls-Royce SMR. You can write in English or Welsh.\": \"Helo! Fi yw eich hyfforddwr gyrfa AI. Dywedwch wrtha i beth rydych chi’n ei fwynhau, neu gofynnwch unrhyw beth i mi am swyddi, hyfforddiant a phrentisiaethau yn Rolls-Royce SMR. Gallwch ysgrifennu yn Gymraeg neu yn Saesneg.\", \"Rolls-Royce SMR says it is the only small modular reactor company with projects under contract in more than one European country. Pick a project to see the jobs behind it.\": \"Mae Rolls-Royce SMR yn dweud mai dyma’r unig gwmni adweithyddion modiwlar bach sydd â phrosiectau dan gontract mewn mwy nag un wlad Ewropeaidd. Dewiswch brosiect i weld y swyddi y tu ôl iddo.\", \"Build, and one day run, the UK’s first small modular reactors at Wylfa on Anglesey. Construction, trades and future plant operations, close to home for people in North Wales.\": \"Adeiladu, ac un diwrnod rhedeg, adweithyddion modiwlar bach cyntaf y DU yn Wylfa ar Ynys Môn. Adeiladu, crefftau a gweithredu’r gwaith yn y dyfodol, yn agos at adref i bobl yng Ngogledd Cymru.\", \"Rolls-Royce has powered the Royal Navy’s nuclear submarines for decades. Engineering, safety and leadership skills from service transfer straight into small modular reactors.\": \"Mae Rolls-Royce wedi pweru llongau tanfor niwclear y Llynges Frenhinol ers degawdau. Mae sgiliau peirianneg, diogelwch ac arwain o’r lluoedd yn trosglwyddo’n syth i adweithyddion modiwlar bach.\", \"This site works in Welsh and English. Coleg Menai teaches in both languages, and Rolls-Royce SMR publishes Wylfa news in Welsh [Welsh-medium apprenticeship options to confirm].\": \"Mae’r wefan hon yn gweithio yn Gymraeg ac yn Saesneg. Mae Coleg Menai’n addysgu yn y ddwy iaith, ac mae Rolls-Royce SMR yn cyhoeddi newyddion Wylfa yn Gymraeg [opsiynau prentisiaeth cyfrwng Cymraeg i’w cadarnhau].\", \"Try real Rolls-Royce SMR jobs in free virtual work experience, from welding reactor parts to proving a plant is safe. Tell us who you are and we’ll tailor the whole site to you.\": \"Rhowch gynnig ar swyddi go iawn Rolls-Royce SMR mewn profiad gwaith rhithwir am ddim, o weldio rhannau adweithydd i brofi bod gorsaf yn ddiogel. Dywedwch wrthon ni pwy ydych chi a byddwn ni’n teilwra’r wefan gyfan i chi.\", \"Each 5-day VWE (25 learning hours) follows a real Rolls-Royce SMR project and showcases eight jobs at Rolls-Royce SMR and its supply chain. Your results replace a CV when you apply.\": \"Mae pob PGRh 5 diwrnod (25 awr ddysgu) yn dilyn prosiect go iawn Rolls-Royce SMR ac yn rhoi sylw i wyth swydd yn Rolls-Royce SMR a’i gadwyn gyflenwi. Mae eich canlyniadau’n cymryd lle CV pan fyddwch yn gwneud cais.\", \"Engineer pay from Rolls-Royce SMR adverts, 2025. Apprentice pay shown is the legal minimum from April 2026. Roles marked [to confirm] need figures from Rolls-Royce SMR’s early careers team.\": \"Cyflog peirianwyr o hysbysebion Rolls-Royce SMR, 2025. Y cyflog prentis a ddangosir yw’r isafswm cyfreithiol o fis Ebrill 2026. Mae angen ffigurau gan dîm gyrfaoedd cynnar Rolls-Royce SMR ar gyfer swyddi sydd wedi’u marcio [i’w gadarnhau].\", \"Free VWEs in English and Welsh, curriculum lessons in science, history and geography, 30-minute teacher training and a class dashboard with Gatsby Benchmark and Careers Wales evidence built in.\": \"PGRh am ddim yn Gymraeg ac yn Saesneg, gwersi cwricwlwm mewn gwyddoniaeth, hanes a daearyddiaeth, hyfforddiant 30 munud i athrawon a dangosfwrdd dosbarth gyda thystiolaeth Meincnodau Gatsby a Gyrfa Cymru wedi’i chynnwys.\", \"Reach, engagement and applicant data from this programme is private to Rolls-Royce SMR. Sign in with your Rolls-Royce SMR account to see progress against local skills and Wylfa community goals.\": \"Mae data cyrhaeddiad, ymgysylltu ac ymgeiswyr o’r rhaglen hon yn breifat i Rolls-Royce SMR. Mewngofnodwch gyda’ch cyfrif Rolls-Royce SMR i weld cynnydd yn erbyn nodau sgiliau lleol a chymuned Wylfa.\", \"A Nuclear Engineering Degree Apprentice featured on Rolls-Royce SMR’s early careers page. She is active in the BETA early careers network and REACH, the racial, ethnic and cultural heritage network.\": \"Prentis Gradd Peirianneg Niwclear sy’n cael sylw ar dudalen gyrfaoedd cynnar Rolls-Royce SMR. Mae hi’n weithgar yn rhwydwaith gyrfaoedd cynnar BETA a REACH, y rhwydwaith treftadaeth hiliol, ethnig a diwylliannol.\", \"Which job suits you, what to study, how apprenticeships work, what Wylfa will mean for Ynys Môn. The coach knows the jobs on this site and what you’ve done so far, and it answers in English or Welsh.\": \"Pa swydd sy’n eich siwtio, beth i’w astudio, sut mae prentisiaethau’n gweithio, beth fydd Wylfa’n ei olygu i Ynys Môn. Mae’r hyfforddwr yn gwybod am y swyddi ar y wefan hon a beth rydych chi wedi’i wneud hyd yma, ac mae’n ateb yn Gymraeg neu yn Saesneg.\", \"Six job families: site construction and operations, manufacturing and modules, nuclear engineering and design, safety and regulation, digital and control systems, and projects, supply chain and business.\": \"Chwe theulu swyddi: adeiladu a gweithredu’r safle, gweithgynhyrchu a modiwlau, peirianneg a dylunio niwclear, diogelwch a rheoleiddio, systemau digidol a rheoli, a phrosiectau, cadwyn gyflenwi a busnes.\", \"Online work experience where you try a real job through films, quizzes and simulations based on real Rolls-Royce SMR jobs. You earn a certificate and skill scores. When you apply, your results replace a CV.\": \"Profiad gwaith ar-lein lle rydych chi’n rhoi cynnig ar swydd go iawn drwy ffilmiau, cwisiau ac efelychiadau sy’n seiliedig ar swyddi go iawn Rolls-Royce SMR. Rydych chi’n ennill tystysgrif a sgoriau sgiliau. Pan fyddwch yn gwneud cais, mae eich canlyniadau’n cymryd lle CV.\", \"Yes. Apprenticeships are open at any age, and Rolls-Royce SMR welcomes school leavers and people changing career. Skills from the forces, especially nuclear submarines and marine engineering, transfer well.\": \"Gallan. Mae prentisiaethau ar agor i bobl o unrhyw oed, ac mae Rolls-Royce SMR yn croesawu pobl sy’n gadael yr ysgol a phobl sy’n newid gyrfa. Mae sgiliau o’r lluoedd, yn enwedig llongau tanfor niwclear a pheirianneg forol, yn trosglwyddo’n dda.\", \"Five free 5-day VWEs (25 learning hours each), each showcasing eight jobs at Rolls-Royce SMR and its supply chain, plus 40 thirty-minute career spotlights. No CV needed: your VWE results are your application.\": \"Pum PGRh 5 diwrnod am ddim (25 awr ddysgu yr un), pob un yn rhoi sylw i wyth swydd yn Rolls-Royce SMR a’i gadwyn gyflenwi, a 40 sbotolau gyrfa 30 munud. Dim angen CV: canlyniadau eich PGRh yw eich cais.\", \"Your progress is saved in this browser only. It’s shared with Rolls-Royce SMR or a supply-chain employer only when you choose to apply with your results. At launch it will sit in your Developing Experts account.\": \"Mae eich cynnydd wedi’i gadw yn y porwr hwn yn unig. Dim ond pan fyddwch chi’n dewis gwneud cais gyda’ch canlyniadau y caiff ei rannu â Rolls-Royce SMR neu gyflogwr yn y gadwyn gyflenwi. Yn y lansiad, bydd yn eich cyfrif Developing Experts.\", \"Coleg Menai, Pioneer Works and EXPERI are from Rolls-Royce SMR’s published news. Entries marked [to confirm] are possible partners to agree with Rolls-Royce SMR and each provider; course lists need checking with each one.\": \"Mae Coleg Menai, Pioneer Works ac EXPERI yn dod o newyddion cyhoeddedig Rolls-Royce SMR. Mae’r cofnodion sydd wedi’u marcio [i’w gadarnhau] yn bartneriaid posibl i’w cytuno â Rolls-Royce SMR a phob darparwr; mae angen gwirio rhestrau cyrsiau gyda phob un.\", \"Each VWE links to science, history and geography lessons already in the Developing Experts library, with expert career films from industry partners. Lessons open on developingexperts.com; full access needs a school account.\": \"Mae pob PGRh yn cysylltu â gwersi gwyddoniaeth, hanes a daearyddiaeth sydd eisoes yn llyfrgell Developing Experts, gyda ffilmiau gyrfa gan arbenigwyr o bartneriaid diwydiant. Mae’r gwersi’n agor ar developingexperts.com; mae angen cyfrif ysgol i gael mynediad llawn.\", \"At EXPERI, in the AMRC’s Factory 2050, Rolls-Royce SMR builds and tests working prototypes of the modules that make up its plants. About 90% of each plant is built in factories, and Aker Solutions is its primary module partner.\": \"Yn EXPERI, yn Factory 2050 yr AMRC, mae Rolls-Royce SMR yn adeiladu ac yn profi prototeipiau gweithredol o’r modiwlau sy’n creu ei orsafoedd. Mae tua 90% o bob gorsaf yn cael ei hadeiladu mewn ffatrïoedd, ac Aker Solutions yw ei brif bartner modiwlau.\", \"A £12m non-nuclear site due to open in late 2026. It will develop the methods for building the reactor’s primary circuit and other high-integrity parts, create and sustain around 40 skilled roles, and be Rolls-Royce SMR’s first training centre.\": \"Safle £12m heb fod yn niwclear sydd i fod i agor ddiwedd 2026. Bydd yn datblygu’r dulliau ar gyfer adeiladu cylched gynradd yr adweithydd a rhannau cywirdeb uchel eraill, yn creu ac yn cynnal tua 40 o swyddi medrus, a hi fydd canolfan hyfforddi gyntaf Rolls-Royce SMR.\", \"In June 2026 Videberg Kraft, owned by Vattenfall and Industrikraft, chose Rolls-Royce SMR for three reactors next to Ringhals after a four-year selection from more than 70 options. Detailed planning has begun; the first unit is not expected before the mid-2030s.\": \"Ym mis Mehefin 2026 dewisodd Videberg Kraft, sy’n eiddo i Vattenfall ac Industrikraft, Rolls-Royce SMR ar gyfer tri adweithydd ger Ringhals ar ôl proses ddethol pedair blynedd o blith mwy na 70 o opsiynau. Mae’r cynllunio manwl wedi dechrau; does dim disgwyl i’r uned gyntaf weithredu cyn canol y 2030au.\", \"The first Wylfa apprentices train at Coleg Menai in Llangefni, studying a Level 3 engineering qualification alongside in-house training. Pioneer Works in Derby, opening in late 2026, will be Rolls-Royce SMR’s first training centre for welding, testing and assembly.\": \"Mae prentisiaid cyntaf Wylfa’n hyfforddi yng Ngholeg Menai yn Llangefni, yn astudio cymhwyster peirianneg Lefel 3 ochr yn ochr â hyfforddiant mewnol. Pioneer Works yn Derby, sy’n agor ddiwedd 2026, fydd canolfan hyfforddi gyntaf Rolls-Royce SMR ar gyfer weldio, profi a chydosod.\", \"ČEZ, which owns about 20% of Rolls-Royce SMR, plans up to 3 GW of Rolls-Royce SMRs in Czechia, starting at Temelín. An early works contract signed in April 2026 started site-specific design and licensing, and Rolls-Royce SMR opened its first Czech office in Prague.\": \"Mae ČEZ, sy’n berchen ar tua 20% o Rolls-Royce SMR, yn bwriadu adeiladu hyd at 3 GW o Rolls-Royce SMR yn Tsiecia, gan ddechrau yn Temelín. Dechreuodd contract gwaith cynnar a lofnodwyd ym mis Ebrill 2026 y gwaith dylunio a thrwyddedu ar gyfer y safle, ac agorodd Rolls-Royce SMR ei swyddfa gyntaf yn Tsiecia ym Mhrâg.\", \"The primary training hub for the first wave of Wylfa apprentices. Coleg Menai works with Rolls-Royce SMR and Great British Energy – Nuclear to train people from North Wales for the nuclear workforce, and its Llangefni campus hosted the Welsh Government’s North Wales skills summit in January 2026.\": \"Y brif ganolfan hyfforddi ar gyfer y don gyntaf o brentisiaid Wylfa. Mae Coleg Menai’n gweithio gyda Rolls-Royce SMR a Great British Energy – Nuclear i hyfforddi pobl o Ogledd Cymru ar gyfer y gweithlu niwclear, a chynhaliodd ei gampws yn Llangefni uwchgynhadledd sgiliau Gogledd Cymru Llywodraeth Cymru ym mis Ionawr 2026.\", \"In April 2026 Rolls-Royce SMR and Great British Energy – Nuclear signed a contract to deliver three small modular reactors at Wylfa, the UK’s first. Work has started on site-specific design, regulatory engagement and planning ahead of a final investment decision, with power expected by the mid-2030s.\": \"Ym mis Ebrill 2026 llofnododd Rolls-Royce SMR a Great British Energy – Nuclear gontract i ddarparu tri adweithydd modiwlar bach yn Wylfa, y cyntaf yn y DU. Mae gwaith wedi dechrau ar ddylunio ar gyfer y safle, ymgysylltu â rheoleiddwyr a chynllunio cyn penderfyniad buddsoddi terfynol, gyda disgwyl pŵer erbyn canol y 2030au.\", \"Each plant is designed to run for at least 60 years. Rolls-Royce SMR and its supply chain expect to create about 3,000 jobs near Wylfa and 5,000 more across the UK, and Czechia and Sweden will need skilled people too. Many of these jobs are trades and technician roles that start with an apprenticeship.\": \"Mae pob gorsaf wedi’i dylunio i redeg am o leiaf 60 mlynedd. Mae Rolls-Royce SMR a’i gadwyn gyflenwi’n disgwyl creu tua 3,000 o swyddi ger Wylfa a 5,000 arall ar draws y DU, a bydd angen pobl fedrus yn Tsiecia a Sweden hefyd. Mae llawer o’r swyddi hyn yn swyddi crefft a thechnegydd sy’n dechrau gyda phrentisiaeth.\", \"The Rolls-Royce SMR is a 470 MW pressurised water reactor. Its design is in the final step of the UK’s Generic Design Assessment by the Office for Nuclear Regulation, the Environment Agency and Natural Resources Wales. In March 2026 it became the first SMR design to receive regulatory justification in the UK.\": \"Adweithydd dŵr dan wasgedd 470 MW yw’r Rolls-Royce SMR. Mae ei ddyluniad yng ngham olaf Asesiad Dylunio Generig y DU gan y Swyddfa Rheoleiddio Niwclear, Asiantaeth yr Amgylchedd a Cyfoeth Naturiol Cymru. Ym mis Mawrth 2026, hwn oedd y dyluniad SMR cyntaf i gael cyfiawnhad rheoleiddiol yn y DU.\", \"Estimate only, not financial advice. Uses 2026/27 Income Tax and employee National Insurance for England, Wales and Northern Ireland (Scottish rates differ). Rents are scaled from ONS average private rents, September 2026; other costs are starter estimates you can change. Engineer pay from Rolls-Royce SMR adverts, 2025.\": \"Amcangyfrif yn unig, nid cyngor ariannol. Yn defnyddio Treth Incwm 2026/27 ac Yswiriant Gwladol gweithwyr ar gyfer Cymru, Lloegr a Gogledd Iwerddon (mae cyfraddau’r Alban yn wahanol). Mae rhenti wedi’u graddio o renti preifat cyfartalog yr ONS, Medi 2026; mae costau eraill yn amcangyfrifon cychwynnol y gallwch eu newid. Cyflog peirianwyr o hysbysebion Rolls-Royce SMR, 2025.\", \"Rolls-Royce SMR’s mission is clean, affordable energy for all. About 90% of each plant is built in factories, so its workforce spans workshops, design offices and construction sites. Its skills approach has three anchors: local training near Wylfa, a manufacturing training centre in Derby, and early careers routes from Level 3 to degree.\": \"Cenhadaeth Rolls-Royce SMR yw ynni glân, fforddiadwy i bawb. Mae tua 90% o bob gorsaf yn cael ei hadeiladu mewn ffatrïoedd, felly mae ei weithlu’n cynnwys gweithdai, swyddfeydd dylunio a safleoedd adeiladu. Mae tair sylfaen i’w dull sgiliau: hyfforddiant lleol ger Wylfa, canolfan hyfforddi gweithgynhyrchu yn Derby, a llwybrau gyrfaoedd cynnar o Lefel 3 i radd.\", \"The UK and Welsh governments want Wylfa’s jobs to go to local people, with clear skills and training routes from the start. On Ynys Môn, where more than half of people speak Welsh, careers support has to work in both languages. This site is fully bilingual, and its VWEs link to the Curriculum for Wales as well as England’s national curriculum.\": \"Mae llywodraethau’r DU a Chymru eisiau i swyddi Wylfa fynd i bobl leol, gyda llwybrau sgiliau a hyfforddiant clir o’r dechrau. Ar Ynys Môn, lle mae mwy na hanner y bobl yn siarad Cymraeg, rhaid i gymorth gyrfaoedd weithio yn y ddwy iaith. Mae’r wefan hon yn gwbl ddwyieithog, ac mae ei PGRh yn cysylltu â Chwricwlwm i Gymru yn ogystal â chwricwlwm cenedlaethol Lloegr.\", \"A £12m manufacturing development centre due to open in late 2026. It will develop the build processes, precision assembly and advanced testing for the heart of the reactor, create around 40 skilled roles, and be Rolls-Royce SMR’s first training centre for welding, testing and assembly. It works alongside EXPERI at the University of Sheffield AMRC.\": \"Canolfan datblygu gweithgynhyrchu £12m sydd i fod i agor ddiwedd 2026. Bydd yn datblygu’r prosesau adeiladu, y cydosod manwl gywir a’r profi uwch ar gyfer calon yr adweithydd, yn creu tua 40 o swyddi medrus, a hi fydd canolfan hyfforddi gyntaf Rolls-Royce SMR ar gyfer weldio, profi a chydosod. Mae’n gweithio ochr yn ochr ag EXPERI yn AMRC Prifysgol Sheffield.\", \"Wylfa will need thousands of local workers, and the first apprentices are already training at Coleg Menai. This site brings that work into the classroom, in Welsh and English. Every virtual work experience is free, with a 30-minute teacher training resource, curriculum links for England and the Curriculum for Wales, and Gatsby Benchmark evidence. Schools near Rolls-Royce SMR sites can also get sponsored places on the Developing Experts lesson unit library [sponsorship to agree with Rolls-Royce SMR].\": \"Bydd angen miloedd o weithwyr lleol ar Wylfa, ac mae’r prentisiaid cyntaf eisoes yn hyfforddi yng Ngholeg Menai. Mae’r wefan hon yn dod â’r gwaith hwnnw i’r ystafell ddosbarth, yn Gymraeg ac yn Saesneg. Mae pob profiad gwaith rhithwir am ddim, gydag adnodd hyfforddi 30 munud i athrawon, cysylltiadau â chwricwlwm Lloegr a Chwricwlwm i Gymru, a thystiolaeth Meincnodau Gatsby. Gall ysgolion ger safleoedd Rolls-Royce SMR hefyd gael lleoedd wedi’u noddi ar lyfrgell unedau gwersi Developing Experts [nawdd i’w gytuno â Rolls-Royce SMR].\", \"Part\": \"Rhan\", \"Part \": \"Rhan\", \"Prague\": \"Prâg\", \"Rolls-Royce SMR · Wylfa, Ynys Môn · Derby · Manchester · Warrington\": \"Rolls-Royce SMR · Wylfa, Ynys Môn · Derby · Manceinion · Warrington\", \"Engineering and business teams\": \"Timau peirianneg a busnes\", \"Manufacturing development and first training centre\": \"Datblygu gweithgynhyrchu a’r ganolfan hyfforddi gyntaf\", \"Nuclear Futures Institute\": \"Sefydliad Dyfodol Niwclear\", \"Three Rolls-Royce SMRs planned, Ynys Môn\": \"Tri Rolls-Royce SMR wedi’u cynllunio, Ynys Môn\", \"Type\": \"Math\", \"bold\": \"print trwm\", \"Place\": \"Lle\", \"Nuclear\": \"Niwclear\", \"Reactor\": \"Adweithydd\", \"Building\": \"Adeiladu\", \". Turn on\": \". Trowch\", \"Designing\": \"Dylunio\", \"Easy read\": \"Hawdd ei ddarllen\", \"Try a job →\": \"Rhowch gynnig ar swydd →\", \"Making parts\": \"Gwneud rhannau\", \"Simple words\": \"Geiriau syml\", \"Stop reading\": \"Stopio darllen\", \"Power station\": \"Gorsaf bŵer\", \"See the jobs →\": \"Gweld y swyddi →\", \"This is called\": \"Yr enw ar hyn yw\", \"apprenticeship\": \"phrentisiaeth\", \"power stations\": \"gorsafoedd pŵer bach\", \"Ask the coach →\": \"Gofyn i’r hyfforddwr →\", \"Easy read guide\": \"Canllaw hawdd ei ddarllen\", \"It designs small\": \"Mae’n dylunio\", \"Plan my way in →\": \"Cynllunio fy ffordd i mewn →\", \": safety experts.\": \": arbenigwyr diogelwch.\", \"Jobs in this area\": \"Swyddi y
