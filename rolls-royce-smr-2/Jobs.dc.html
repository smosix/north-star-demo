<body>
  <div id="__bundler_placeholder">Loading Rolls-Royce SMR jobs map, pay and lifestyle calculator...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

hip, or take a T Level, BTEC, A levels or the Welsh Baccalaureate at college.\": \"Gwnewch gais am brentisiaeth Lefel 3, neu astudiwch Lefel T, BTEC, Safon Uwch neu Fagloriaeth Cymru yn y coleg.\", \"On the job in Derby, Manchester or Warrington, with a university partner for degree apprentices [to confirm]\": \"Yn y gwaith yn Derby, Manceinion neu Warrington, gyda phartner prifysgol ar gyfer prentisiaid gradd [i’w gadarnhau]\", \"Take the career finder and try two virtual work experiences. Talk to your careers leader about what you enjoyed.\": \"Defnyddiwch yr offeryn canfod gyrfa a rhowch gynnig ar ddau brofiad gwaith rhithwir. Siaradwch â’ch arweinydd gyrfaoedd am beth wnaethoch chi ei fwynhau.\", \"Nuclear apprenticeships usually ask for maths, English and science [entry grades to confirm with Rolls-Royce SMR].\": \"Fel arfer, mae prentisiaethau niwclear yn gofyn am fathemateg, Saesneg a gwyddoniaeth [graddau mynediad i’w cadarnhau gyda Rolls-Royce SMR].\", \"Click a pin or a place name to see the jobs and training in that area. Filter by project sites, training or offices.\": \"Cliciwch ar bin neu enw lle i weld y swyddi a’r hyfforddiant yn yr ardal honno. Hidlwch yn ôl safleoedd prosiect, hyfforddiant neu swyddfeydd.\", \"Engineering, electrical, science, IT or business courses all help. Ask your tutor how your course maps to this role.\": \"Mae cyrsiau peirianneg, trydanol, gwyddoniaeth, TG neu fusnes i gyd yn helpu. Gofynnwch i’ch tiwtor sut mae eich cwrs yn cyd-fynd â’r rôl hon.\", \"Coleg Menai in Llangefni for the Level 3 apprenticeship, or the graduate programme in Derby, Manchester or Warrington\": \"Coleg Menai yn Llangefni ar gyfer y brentisiaeth Lefel 3, neu’r rhaglen raddedigion yn Derby, Manceinion neu Warrington\", \"Use VWEs as evidence in your applications, match your course to Rolls-Royce SMR roles and apply when recruitment opens.\": \"Defnyddiwch y PGRh fel tystiolaeth yn eich ceisiadau, paru eich cwrs â swyddi Rolls-Royce SMR a gwneud cais pan fydd recriwtio’n agor.\", \"Concept draft for discussion with Rolls-Royce SMR · facts from Rolls-Royce SMR’s published news and adverts, 2025 to 2026\": \"Drafft cysyniad i’w drafod gyda Rolls-Royce SMR · ffeithiau o newyddion a hysbysebion cyhoeddedig Rolls-Royce SMR, 2025 i 2026\", \"Build the digital twin of the plant, the control systems that run it and the data that keeps a fleet of reactors on track.\": \"Adeiladu efaill digidol y gwaith, y systemau rheoli sy’n ei redeg a’r data sy’n cadw fflyd o adweithyddion ar y trywydd iawn.\", \"Engineering, operations, safety, logistics and leadership skills from service transfer straight into Rolls-Royce SMR roles.\": \"Mae sgiliau peirianneg, gweithrediadau, diogelwch, logisteg ac arwain o’r lluoedd yn trosglwyddo’n syth i swyddi Rolls-Royce SMR.\", \"Maths, English and science keep this route open. Engineering, computing or design GCSEs help too. [Entry grades to confirm]\": \"Mae mathemateg, Saesneg a gwyddoniaeth yn cadw’r llwybr hwn ar agor. Mae TGAU peirianneg, cyfrifiadureg neu ddylunio’n helpu hefyd. [Graddau mynediad i’w cadarnhau]\", \"You can start an apprenticeship at 16. Use the next few years to find what you enjoy and build the evidence employers look for.\": \"Gallwch ddechrau prentisiaeth yn 16 oed. Defnyddiwch yr ychydig flynyddoedd nesaf i ddarganfod beth rydych chi’n ei fwynhau a chasglu’r dystiolaeth mae cyflogwyr yn chwilio amdani.\", \"Prove the plant is safe, secure and protects the environment, and work with the regulators who check every detail of the design.\": \"Profi bod y gwaith yn ddiogel, yn saff ac yn diogelu’r amgylchedd, a gweithio gyda’r rheoleiddwyr sy’n gwirio pob manylyn o’r dyluniad.\", \"A degree in a related subject, or a degree apprenticeship that pays you while you study [routes to confirm with Rolls-Royce SMR].\": \"Gradd mewn pwnc perthnasol, neu brentisiaeth gradd sy’n talu i chi wrth astudio [llwybrau i’w cadarnhau gyda Rolls-Royce SMR].\", \"College training plus learning on the job. Wylfa apprentices study a Level 3 engineering qualification at Coleg Menai, Llangefni.\": \"Hyfforddiant coleg a dysgu yn y gwaith. Mae prentisiaid Wylfa’n astudio cymhwyster peirianneg Lefel 3 yng Ngholeg Menai, Llangefni.\", \"Pick a nuclear job, where you’d live and how. See your take-home pay, what’s left each month, and how fast you could reach a goal.\": \"Dewiswch swydd niwclear, ble byddech chi’n byw a sut. Gweld eich cyflog net, beth sydd ar ôl bob mis, a pha mor gyflym gallech chi gyrraedd nod.\", \"Apply with your results profile. Support for veterans, reservists, spouses and partners [Armed Forces Covenant details to confirm].\": \"Gwnewch gais gyda phroffil eich canlyniadau. Cymorth i gyn-filwyr, milwyr wrth gefn, priod a phartneriaid [manylion Cyfamod y Lluoedd Arfog i’w cadarnhau].\", \"Trainee roles may need you to be 18 [to confirm]. Meanwhile, a college course or apprenticeship in the same area keeps you on track.\": \"Efallai y bydd angen i chi fod yn 18 oed ar gyfer rolau hyfforddai [i’w gadarnhau]. Yn y cyfamser, mae cwrs coleg neu brentisiaeth yn yr un maes yn eich cadw ar y trywydd iawn.\", \"Plan the programme, buy from hundreds of suppliers, train the workforce and tell the story of Britain’s first small modular reactors.\": \"Cynllunio’r rhaglen, prynu gan gannoedd o gyflenwyr, hyfforddi’r gweithlu ac adrodd stori adweithyddion modiwlar bach cyntaf Prydain.\", \"Try real Rolls-Royce SMR jobs in class or at home, see which subjects lead where, and be ready to apply for an apprenticeship from 16.\": \"Rhowch gynnig ar swyddi go iawn Rolls-Royce SMR yn y dosbarth neu gartref, gweld pa bynciau sy’n arwain i ble, a byddwch yn barod i wneud cais am brentisiaeth o 16 oed.\", \"Rolls-Royce SMR also works in Czechia (Temelín, office in Prague) and Sweden (Värö, next to Ringhals). Map: Natural Earth via world-atlas.\": \"Mae Rolls-Royce SMR hefyd yn gweithio yn Tsiecia (Temelín, swyddfa ym Mhrâg) a Sweden (Värö, ger Ringhals). Map: Natural Earth drwy world-atlas.\", \"This role usually needs a degree. A degree apprenticeship, or a related apprenticeship in the same family, can get you there while you earn.\": \"Fel arfer, mae angen gradd ar gyfer y rôl hon. Gall prentisiaeth gradd, neu brentisiaeth berthnasol yn yr un teulu, eich cael chi yno wrth ennill cyflog.\", \"Apprenticeships are open at any age, and Wylfa will need thousands of construction and trades workers. Your experience from other jobs counts.\": \"Mae prentisiaethau ar agor i bobl o unrhyw oed, a bydd angen miloedd o weithwyr adeiladu a chrefftau ar Wylfa. Mae eich profiad o swyddi eraill yn cyfrif.\", \"You don’t need a degree. Many routes train you from scratch while you earn, and skills from oil and gas, construction or factories transfer well.\": \"Does dim angen gradd arnoch chi. Mae llawer o lwybrau’n eich hyfforddi o’r dechrau wrth i chi ennill cyflog, ac mae sgiliau o olew a nwy, adeiladu neu ffatrïoedd yn trosglwyddo’n dda.\", \"From welder to reactor designer: pick a job family to see what each role does, how to get in, and the virtual work experience that lets you try it.\": \"O weldiwr i ddylunydd adweithyddion: dewiswch deulu swyddi i weld beth mae pob rôl yn ei wneud, sut i gael mynediad, a’r profiad gwaith rhithwir sy’n gadael i chi roi cynnig arni.\", \"Design a 470 MW pressurised water reactor that can power about a million homes for at least 60 years. Physics, maths and engineering at the cutting edge.\": \"Dylunio adweithydd dŵr dan wasgedd 470 MW a all bweru tua miliwn o gartrefi am o leiaf 60 mlynedd. Ffiseg, mathemateg a pheirianneg ar flaen y gad.\", \"Rolls-Royce SMR recruits graduates from engineering, physics, maths, systems, risk and other STEM degrees, with teams in Derby, Manchester and Warrington.\": \"Mae Rolls-Royce SMR yn recriwtio graddedigion peirianneg, ffiseg, mathemateg, systemau, risg a graddau STEM eraill, gyda thimau yn Derby, Manceinion a Warrington.\", \"Wylfa is due to supply power by the mid-2030s. Operator training will start before then; a related apprenticeship now keeps you on track [details to confirm].\": \"Mae disgwyl i Wylfa gyflenwi pŵer erbyn canol y 2030au. Bydd hyfforddiant gweithredwyr yn dechrau cyn hynny; mae prentisiaeth berthnasol nawr yn eich cadw ar y trywydd iawn [manylion i’w cadarnhau].\", \"About 90% of a Rolls-Royce SMR is made in factories as modules, then put together on site. Weld, assemble, inspect and test the parts at the heart of the reactor.\": \"Mae tua 90% o Rolls-Royce SMR yn cael ei wneud mewn ffatrïoedd fel modiwlau, yna’n cael ei roi at ei gilydd ar y safle. Weldio, cydosod, archwilio a phrofi’r rhannau wrth galon yr adweithydd.\", \"Locations from Rolls-Royce SMR’s published news and adverts, 2025 to 2026. Live vacancy feeds from Rolls-Royce SMR and supply-chain partners to connect at launch.\": \"Lleoliadau o newyddion a hysbysebion cyhoeddedig Rolls-Royce SMR, 2025 i 2026. Ffrydiau swyddi gwag byw gan Rolls-Royce SMR a phartneriaid y gadwyn gyflenwi i’w cysylltu yn y lansiad.\", \"Graduate programmes in safety and regulation, plus roles in design, physics, digital engineering and project delivery. Try the work first, then apply with evidence.\": \"Rhaglenni graddedigion ym maes diogelwch a rheoleiddio, a swyddi mewn dylunio, ffiseg, peirianneg ddigidol a chyflawni prosiectau. Rhowch gynnig ar y gwaith yn gyntaf, yna gwneud cais gyda thystiolaeth.\", \"Engineering, electrical, science, IT and business courses all lead into nuclear roles. Apprenticeships for each September usually open months before, so start early.\": \"Mae cyrsiau peirianneg, trydanol, gwyddoniaeth, TG a busnes i gyd yn arwain at swyddi niwclear. Mae prentisiaethau ar gyfer pob mis Medi fel arfer yn agor fisoedd ymlaen llaw, felly dechreuwch yn gynnar.\", \"Build, and one day run, the UK’s first small modular reactors at Wylfa on Anglesey. Construction, trades and future plant operations, close to home for people in North Wales.\": \"Adeiladu, ac un diwrnod rhedeg, adweithyddion modiwlar bach cyntaf y DU yn Wylfa ar Ynys Môn. Adeiladu, crefftau a gweithredu’r gwaith yn y dyfodol, yn agos at adref i bobl yng Ngogledd Cymru.\", \"Rolls-Royce has powered the Royal Navy’s nuclear submarines for decades. Engineering, safety and leadership skills from service transfer straight into small modular reactors.\": \"Mae Rolls-Royce wedi pweru llongau tanfor niwclear y Llynges Frenhinol ers degawdau. Mae sgiliau peirianneg, diogelwch ac arwain o’r lluoedd yn trosglwyddo’n syth i adweithyddion modiwlar bach.\", \"Try real Rolls-Royce SMR jobs in free virtual work experience, from welding reactor parts to proving a plant is safe. Tell us who you are and we’ll tailor the whole site to you.\": \"Rhowch gynnig ar swyddi go iawn Rolls-Royce SMR mewn profiad gwaith rhithwir am ddim, o weldio rhannau adweithydd i brofi bod gorsaf yn ddiogel. Dywedwch wrthon ni pwy ydych chi a byddwn ni’n teilwra’r wefan gyfan i chi.\", \"Engineer pay from Rolls-Royce SMR adverts, 2025. Apprentice pay shown is the legal minimum from April 2026. Roles marked [to confirm] need figures from Rolls-Royce SMR’s early careers team.\": \"Cyflog peirianwyr o hysbysebion Rolls-Royce SMR, 2025. Y cyflog prentis a ddangosir yw’r isafswm cyfreithiol o fis Ebrill 2026. Mae angen ffigurau gan dîm gyrfaoedd cynnar Rolls-Royce SMR ar gyfer swyddi sydd wedi’u marcio [i’w gadarnhau].\", \"Estimate only, not financial advice. Uses 2026/27 Income Tax and employee National Insurance for England, Wales and Northern Ireland (Scottish rates differ). Rents are scaled from ONS average private rents, September 2026; other costs are starter estimates you can change. Engineer pay from Rolls-Royce SMR adverts, 2025.\": \"Amcangyfrif yn unig, nid cyngor ariannol. Yn defnyddio Treth Incwm 2026/27 ac Yswiriant Gwladol gweithwyr ar gyfer Cymru, Lloegr a Gogledd Iwerddon (mae cyfraddau’r Alban yn wahanol). Mae rhenti wedi’u graddio o renti preifat cyfartalog yr ONS, Medi 2026; mae costau eraill yn amcangyfrifon cychwynnol y gallwch eu newid. Cyflog peirianwyr o hysbysebion Rolls-Royce SMR, 2025.\", \"Rolls-Royce SMR · Wylfa, Ynys Môn · Derby · Manchester · Warrington\": \"Rolls-Royce SMR · Wylfa, Ynys Môn · Derby · Manceinion · Warrington\", \"Engineering and business teams\": \"Timau peirianneg a busnes\", \"Manufacturing development and first training centre\": \"Datblygu gweithgynhyrchu a’r ganolfan hyfforddi gyntaf\", \"Nuclear Futures Institute\": \"Sefydliad Dyfodol Niwclear\", \"Three Rolls-Royce SMRs planned, Ynys Môn\": \"Tri Rolls-Royce SMR wedi’u cynllunio, Ynys Môn\", \"Type\": \"Math\", \"Place\": \"Lle\", \"Easy read guide\": \"Canllaw hawdd ei ddarllen\", \"Jobs in this area\": \"Swyddi yn yr ardal hon\", \"What happens there\": \"Beth sy’n digwydd yno\", \"The key facts in short, simple sentences.\": \"Y prif ffeithiau mewn brawddegau byr, syml.\", \"Map as a text list: every place, what happens there and the jobs nearby\": \"Y map fel rhestr destun: pob lle, beth sy’n digwydd yno a’r swyddi gerllaw\", \"Rolls-Royce SMR places in the UK. Choose a place to show it on the map.\": \"Lleoedd Rolls-Royce SMR yn y DU. Dewiswch le i’w ddangos ar y map.\", \"Make “\": \"Gwneud “\", \"From 16\": \"O 16 oed\", \"From 18\": \"O 18 oed\", \"” my goal\": \"” yn nod i mi\", \"After Level 3\": \"Ar ôl Lefel 3\", \"From 16 or 18\": \"O 16 neu 18 oed\", \"See my routes\": \"Gweld fy llwybrau\", \"Compare routes\": \"Cymharu llwybrau\", \"Help me decide\": \"Help i benderfynu\", \"Talk it through\": \"Siarad amdano\", \"Try a spotlight\": \"Rhoi cynnig ar sbotolau\", \"Free at 16 to 18\": \"Am ddim rhwng 16 a 18\", \"Start the finder\": \"Dechrau’r offeryn canfod\", \"Adult trade route\": \"Llwybr crefft i oedolion\", \"About 2 to 4 years\": \"Tua 2 i 4 blynedd\", \"About 3 to 5 years\": \"Tua 3 i 5 mlynedd\", \"Engineering degree\": \"Gradd peirianneg\", \"After a STEM degree\": \"Ar ôl gradd STEM\", \"College course first\": \"Cwrs coleg yn gyntaf\", \"Usually 1 or 2 years\": \"Fel arfer 1 neu 2 flynedd\", \"Usually 3 or 4 years\": \"Fel arfer 3 neu 4 blynedd\", \"Higher apprenticeship\": \"Prentisiaeth uwch\", \"Try two different jobs\": \"Rhoi cynnig ar ddwy swydd wahanol\", \"Compare training routes\": \"Cymharu llwybrau hyfforddi\", \"Digital or data apprenticeship\": \"Prentisiaeth ddigidol neu ddata\", \"Training provider [to confirm]\": \"Darparwr hyfforddiant [i’w gadarnhau]\", \"Business or supply chain degree\": \"Gradd busnes neu gadwyn gyflenwi\", \"Computing or engineering degree\": \"Gradd cyfrifiadureg neu beirianneg\", \"Degree apprenticeship or degree\": \"Prentisiaeth gradd neu radd\", \"Project management apprenticeship\": \"Prentisiaeth rheoli prosiectau\", \"Level 3 engineering apprenticeship\": \"Prentisiaeth peirianneg Lefel 3\", \"You want to earn and learn hands-on\": \"Rydych chi eisiau ennill a dysgu’n ymarferol\", \"Free: your employer pays for training\": \"Am ddim: eich cyflogwr sy’n talu am yr hyfforddiant\", \"See how to train for your top matches\": \"Gweld sut i hyfforddi ar gyfer eich prif gyfatebiaethau\", \"Degree apprenticeship (Levels 6 and 7)\": \"Prentisiaeth gradd (Lefelau 6 a 7)\", \"Higher apprenticeship (Levels 4 and 5)\": \"Prentisiaeth uwch (Lefelau 4 a 5)\", \"You want a degree without student debt\": \"Rydych chi eisiau gradd heb ddyled myfyriwr\", \"No, but some summer placements are paid\": \"Na, ond mae rhai lleoliadau haf â thâl\", \"You have Level 3 and want to go further\": \"Mae gennych chi Lefel 3 ac rydych chi eisiau mynd ymhellach\", \"An apprenticeship, higher study or a job\": \"Prentisiaeth, astudio pellach neu swydd\", \"Digital learning designer apprenticeship\": \"Prentisiaeth dylunio dysgu digidol\", \"Nuclear Engineering Degree Apprenticeship\": \"Prentisiaeth Gradd Peirianneg Niwclear\", \"Tuition fees, usually with a student loan\": \"Ffioedd dysgu, fel arfer gyda benthyciad myfyriwr\", \"You want to try a subject before choosing\": \"Rydych chi eisiau rhoi cynnig ar bwnc cyn dewis\", \"Graduate programme or entry-level engineer\": \"Rhaglen raddedigion neu beiriannydd lefel mynediad\", \"You want to study a subject in depth first\": \"Rydych chi eisiau astudio pwnc yn fanwl yn gyntaf\", \"Technician or tradesperson, then supervisor\": \"Technegydd neu grefftwr, yna goruchwyliwr\", \"Plan work and keep it on time and on budget.\": \"Cynllunio gwaith a’i gadw ar amser ac o fewn y gyllideb.\", \"Safety and Regulatory Affairs Apprenticeship\": \"Prentisiaeth Diogelwch a Materion Rheoleiddio\", \"Engineer, safety specialist or project manager\": \"Peiriannydd, arbenigwr diogelwch neu reolwr prosiect\", \"Senior technician, specialist or project roles\": \"Uwch dechnegydd, arbenigwr neu swyddi prosiect\", \"For procurement, commercial and programme roles.\": \"Ar gyfer swyddi caffael, masnachol a rhaglenni.\", \"University partner [to confirm] or Bangor University\": \"Partner prifysgol [i’w gadarnhau] neu Brifysgol Bangor\", \"Level 5: create training for new starters and STEM events.\": \"Lefel 5: creu hyfforddiant i ddechreuwyr newydd a digwyddiadau STEM.\", \"Four quick questions. See which job families might suit you.\": \"Pedwar cwestiwn cyflym. Gweld pa deuluoedd swyddi allai eich siwtio.\", \"Engineering, physics or maths, then apply for graduate roles.\": \"Peirianneg, ffiseg neu fathemateg, yna gwneud cais am swyddi graddedig.\", \"Civil or construction engineering, for site and project roles.\": \"Peirianneg sifil neu adeiladu, ar gyfer swyddi safle a phrosiect.\", \"Manufacturing or mechanical engineering, then a graduate role.\": \"Peirianneg gweithgynhyrchu neu fecanyddol, yna swydd raddedig.\", \"Yes, at least £15,600 a year [Rolls-Royce SMR rate to confirm]\": \"Oes, o leiaf £15,600 y flwyddyn [cyfradd Rolls-Royce SMR i’w chadarnhau]\", \"Level 3, based on Ynys Môn, studying at Coleg Menai in Llangefni.\": \"Lefel 3, ar Ynys Môn, yn astudio yng Ngholeg Menai yn Llangefni.\", \"Skills from construction, oil and gas or the forces transfer well.\": \"Mae sgiliau o adeiladu, olew a nwy neu’r lluoedd yn trosglwyddo’n dda.\", \"For control and instrumentation, digital engineering or cyber roles.\": \"Ar gyfer swyddi rheoli ac offeryniaeth, peirianneg ddigidol neu seiber.\", \"Each match shows the training routes into it and where you could train.\": \"Mae pob cyfatebiaeth yn dangos y llwybrau hyfforddi i mewn iddi a ble gallech chi hyfforddi.\", \"Four specialisms, including hazards and probabilistic safety assessment.\": \"Pedwar maes arbenigol, gan gynnwys peryglon ac asesu diogelwch tebygolrwyddol.\", \"Apprenticeship, degree apprenticeship or university: see how they differ.\": \"Prentisiaeth, prentisiaeth gradd neu brifysgol: gweld sut maen nhw’n wahanol.\", \"Levels 4 and 5, moving towards senior technician or manufacturing engineer.\": \"Lefelau 4 a 5, gan symud tuag at uwch dechnegydd neu beiriannydd gweithgynhyrchu.\", \"Welding, fitting, assembly or inspection, with training at Pioneer Works in Derby.\": \"Weldio, ffitio, cydosod neu archwilio, gyda hyfforddiant yn Pioneer Works yn Derby.\", \"Software, data or cyber security, at Level 3 up to degree level [routes to confirm].\": \"Meddalwedd, data neu seiberddiogelwch, o Lefel 3 hyd at lefel gradd [llwybrau i’w cadarnhau].\", \"Play two 30-minute spotlights from different job families, so you can compare how they feel.\": \"Chwaraewch ddau sbotolau 30 munud o deuluoedd swyddi gwahanol, er mwyn i chi gymharu sut maen nhw’n teimlo.\", \"Ask the AI coach to help you decide, then talk to a careers leader, teacher or family member.\": \"Gofynnwch i’r hyfforddwr AI eich helpu i benderfynu, yna siaradwch ag arweinydd gyrfaoedd, athro neu aelod o’r teulu.\", \"Electrician, pipefitter or other construction trades, earning while you learn [construction partners to confirm].\": \"Trydanwr, gosodwr pibellau neu grefftau adeiladu eraill, gan ennill wrth ddysgu [partneriaid adeiladu i’w cadarnhau].\", \"Earn a degree while you work on the reactor design. Maths and physics A levels usually help [entry grades to confirm].\": \"Ennill gradd wrth weithio ar ddyluniad yr adweithydd. Mae Safon Uwch mewn mathemateg a ffiseg fel arfer yn helpu [graddau mynediad i’w cadarnhau].\", \"To do\": \"I’w wneud\", \"Choose your country: UK, Czechia, and Sweden and the Netherlands soon.\": \"Dewiswch eich gwlad: y DU, Tsiecia, a Sweden a’r Iseldiroedd yn fuan.\", \"Czech careers hub\": \"Hyb gyrfaoedd Tsiecia\", \"Czech schools, routes and scholarships for Temelín. In Czech and English.\": \"Ysgolion, llwybrau ac ysgoloriaethau Tsiecia ar gyfer Temelín. Yn Tsieceg ac yn Saesneg.\", \"Pilot\": \"Peilot\", \"Rolls-Royce SMR worldwide\": \"Rolls-Royce SMR ledled y byd\", \"Already a welder? Add coded and nuclear quality qualifications with top-up training.\": \"Yn weldiwr yn barod? Ychwanegwch gymwysterau weldio codedig ac ansawdd niwclear gyda hyfforddiant ychwanegol.\", \"Control and instrumentation engineers from oil and gas, rail or process industries can move across.\": \"Gall peirianwyr rheoli ac offeryniaeth o’r diwydiannau olew a nwy, rheilffyrdd neu brosesu symud draw.\", \"Electrical or electronic engineering degree or degree apprenticeship.\": \"Gradd neu brentisiaeth gradd mewn peirianneg drydanol neu electronig.\", \"Engineering apprenticeship, then certificates in testing with ultrasound and X-ray.\": \"Prentisiaeth peirianneg, yna tystysgrifau mewn profi gydag uwchsain a phelydr-X.\", \"Engineers and scientists can move into safety case work with top-up training.\": \"Gall peirianwyr a gwyddonwyr symud i waith achos diogelwch gyda hyfforddiant ychwanegol.\", \"Fastest route in\": \"Y llwybr cyflymaf i mewn\", \"IT and data professionals can move across with a nuclear induction.\": \"Gall gweithwyr TG a data proffesiynol symud draw gyda chyfnod sefydlu niwclear.\", \"If you’re changing career\": \"Os ydych chi’n newid gyrfa\", \"Jobs in high demand\": \"Swyddi y mae galw mawr amdanynt\", \"Lab, healthcare and forces backgrounds can transfer well [to confirm].\": \"Gall cefndir mewn labordy, gofal iechyd neu’r lluoedd drosglwyddo’n dda [i’w gadarnhau].\", \"Level 3 apprenticeship on Ynys Môn, or the Safety and Regulatory Affairs Graduate Programme after a degree.\": \"Prentisiaeth Lefel 3 ar Ynys Môn, neu’r Rhaglen i Raddedigion Diogelwch a Materion Rheoleiddio ar ôl gradd.\", \"Level 3 electrical apprenticeship, for example through Coleg Menai near Wylfa.\": \"Prentisiaeth drydanol Lefel 3, er enghraifft drwy Goleg Menai ger Wylfa.\", \"Level 3 welding or engineering apprenticeship, for example at Pioneer Works, Derby.\": \"Prentisiaeth weldio neu beirianneg Lefel 3, er enghraifft yn Pioneer Works, Derby.\", \"Nuclear quality and inspection skills are in demand across the UK and Europe, and every weld must be checked.\": \"Mae galw am sgiliau ansawdd ac arolygu niwclear ar draws y DU ac Ewrop, ac mae’n rhaid gwirio pob weld.\", \"Nuclear-certified welders and pipefitters are among the hardest people to find, and big nuclear projects compete for them.\": \"Weldwyr a gosodwyr pibellau ag ardystiad niwclear yw rhai o’r bobl anoddaf i’w canfod, ac mae prosiectau niwclear mawr yn cystadlu amdanynt.\", \"Planners, cost and project controls staff from construction or defence are in demand.\": \"Mae galw am gynllunwyr a staff costau a rheoli prosiectau o’r sectorau adeiladu neu amddiffyn.\", \"Project controls and experienced project delivery are among the sharpest skills pressures on nuclear projects.\": \"Rheoli prosiectau a chyflawni prosiectau profiadol yw rhai o’r pwysau sgiliau mwyaf ar brosiectau niwclear.\", \"Project management apprenticeship at Rolls-Royce SMR.\": \"Prentisiaeth rheoli prosiectau yn Rolls-Royce SMR.\", \"Qualified electricians can move across with site inductions and high-voltage training [to confirm].\": \"Gall trydanwyr cymwys symud draw gyda chyfnod sefydlu ar y safle a hyfforddiant foltedd uchel [i’w gadarnhau].\", \"Quality and inspection staff from manufacturing, aerospace or oil and gas can retrain in nuclear testing.\": \"Gall staff ansawdd ac arolygu o weithgynhyrchu, awyrofod neu olew a nwy ailhyfforddi mewn profi niwclear.\", \"Radiological protection is one of the skills areas the nuclear industry has picked out for urgent focus.\": \"Diogelu rhag ymbelydredd yw un o’r meysydd sgiliau y mae’r diwydiant niwclear wedi’u dewis i ganolbwyntio arnynt ar frys.\", \"Science A levels or a Level 3 science or engineering course, then training on the job.\": \"Safon Uwch mewn gwyddoniaeth neu gwrs gwyddoniaeth neu beirianneg Lefel 3, yna hyfforddiant yn y gwaith.\", \"Software and data apprenticeship, or a computing or engineering degree.\": \"Prentisiaeth meddalwedd a data, neu radd mewn cyfrifiadura neu beirianneg.\", \"Starting out (school, college, university)\": \"Dechrau arni (ysgol, coleg, prifysgol)\", \"Changing career or leaving the forces\": \"Newid gyrfa neu adael y lluoedd\", \"Safety case and safety analysis specialists take years to train and are some of the most sought-after people in nuclear.\": \"Mae arbenigwyr achos diogelwch a dadansoddi diogelwch yn cymryd blynyddoedd i’w hyfforddi ac maen nhw ymhlith y bobl y mae’r galw mwyaf amdanynt ym maes niwclear.\", \"The Nuclear Skills Plan aims to double apprentices in trades, including electrical roles. Electrical and control skills are needed on every site.\": \"Nod y Cynllun Sgiliau Niwclear yw dyblu nifer y prentisiaid mewn crefftau, gan gynnwys swyddi trydanol. Mae angen sgiliau trydanol a rheoli ar bob safle.\", \"The government wants a greater focus on digital skills in nuclear, and digital engineering can ease other shortages.\": \"Mae’r llywodraeth eisiau mwy o bwyslais ar sgiliau digidol ym maes niwclear, a gall peirianneg ddigidol leddfu prinder arall.\", \"The nuclear skills in shortest supply, and how to get in.\": \"Y sgiliau niwclear sydd fwyaf prin, a sut i gael mynediad.\", \"★ Hardest to
